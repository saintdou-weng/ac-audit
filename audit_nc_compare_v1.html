window.NC={

 grp(g){F.grp=g;F.std='';render()},
 addS(){this.editS('')},
 editS(id){const x=id?(getS()[id]||{}):{id:'s'+Date.now().toString(36),status:'todo',std:'GRS'};dlg(`<h3>${id?'✏':'＋'} 📅 ${T('驗廠行程','Audit schedule')}</h3><div class="g">${fld('date',T('日期（YYYY-MM-DD）','Date'),x.date)}${fld('end',T('結束日（可空）','End date'),x.end)}${fld('std',T('類別','Type'),x.std,STDS)}${fld('owner',T('負責','Owner'),x.owner)}${fld('status',T('狀態','Status'),x.status,Object.keys(SST))}</div>${fld('title',T('事項','Item'),x.title)}${fld('detail',T('說明','Detail'),x.detail,'area')}${fld('note',T('備註／進度','Note'),x.note,'area')}${id?`<button class="btn d" onclick="NC.delS('${esc(id)}')">🗑 ${T('刪除','Delete')}</button>`:''}`,v=>{if(!v.title){toast(T('要寫事項','Item required'));return false}const S=getS();S[x.id]=Object.assign({},x,v,{updatedAt:NOW()});putS(S);render()})},
 schedText(){const L=scheds(),td=new Date(),ym=td.toISOString().slice(0,7),nx=new Date(td.getFullYear(),td.getMonth()+1,1).toISOString().slice(0,7);
  const open=L.filter(x=>x.status!=='done'),soon=open.filter(x=>String(x.date).slice(0,7)<=nx),later=open.filter(x=>String(x.date).slice(0,7)>nx),late=open.filter(x=>(dLeft(x.date)??1)<0&&!x.end||(x.end&&(dLeft(x.end)??1)<0));
  const done=L.filter(x=>x.status==='done'&&String(x.updatedAt||'').slice(0,7)===ym);
  const ln=x=>{const st=SST[x.status]||SST.todo,d=dLeft(x.date);return `${st[0]} <b>${esc(x.date)}${x.end?'→'+esc(x.end):''}</b> [${esc(x.std)}] ${esc(x.title)}${x.owner?' · 👤 '+esc(x.owner):''}${d!==null&&d>=0&&d<=30?` · ⏰ ${d}${T('天','d')}`:''}${x.note?`\n   📝 ${esc(x.note)}`:''}`};
  let t=`📅 <b>VRT ${T('驗廠行程月報','Audit schedule – monthly')}</b> ${ym}\n━━━━━━━━━━━━\n`;
  t+=`🔴 ${T('過期未完成','Overdue')} ${late.length} · 🟡 ${T('本月＋下月','This & next month')} ${soon.length} · ✅ ${T('本月完成','Done this month')} ${done.length}\n\n`;
  if(soon.length)t+=`<b>${T('本月＋下月','This & next month')}</b>\n`+soon.map(ln).join('\n')+'\n\n';
  if(later.length)t+=`<b>${T('之後','Later')}</b>\n`+later.map(ln).join('\n')+'\n\n';
  if(done.length)t+=`<b>${T('本月完成','Done this month')}</b>\n`+done.map(x=>'✅ '+esc(x.title)).join('\n')+'\n';
  return t.trim()},
 async sendSched(auto){const S=getS(),ym=new Date().toISOString().slice(0,7);if(auto&&S._sent&&S._sent.m===ym)return 'already';
  let url='';try{url=(JSON.parse(localStorage.getItem('ac_audit_config')||'{}').gasUrl||'')}catch(e){} url=(url||'https://script.google.com/macros/s/AKfycbxOXfNmyfqZI6f9Uc__hxcmuiQt-QowkULw23GggAKM6nZ1mQ8DcOx5rwxa7d0obpIf/exec').trim();
  try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'tg',text:this.schedText()})});const j=await r.json();if(!(j.ok||j.status==='ok'))throw Error(j.msg||j.error||'Telegram failed');S._sent={id:'_sent',m:ym,at:new Date().toISOString().slice(0,16).replace('T',' '),updatedAt:NOW()};putS(S);toast(T('已發到 Audit 群組','Sent'));render();return 'sent'}catch(e){toast('⚠ '+e.message);return 'err:'+e.message}},
 delS(id){if(!confirm(T('刪除這個行程？','Delete this item?')))return;const S=getS();S[id]={id,deleted:true,updatedAt:NOW()};putS(S);document.getElementById('mask').classList.remove('on');render()},
 addAudit(){dlg(`<h3>＋ ${T('新增驗廠','Add audit')}</h3><div class="g">${fld('std',T('標準','Standard'),'WRAP',STDS)}${fld('year',T('年度','Year'),String(new Date().getFullYear()))}${fld('date',T('日期','Date'),'')}${fld('firm',T('驗廠公司','Audit firm'),'')}${fld('type',T('類型','Type'),'')}</div>${fld('result',T('結果','Result'),'')}${fld('src',T('來源檔','Source'),'')}`,v=>{if(!/^\d{4}$/.test(v.year)){toast(T('年度要 4 位數','Year must be 4 digits'));return false}const id=v.std+'-'+v.year+(audits().some(a=>a.id===v.std+'-'+v.year)?'-'+Date.now().toString(36).slice(-4):'');save({id,std:v.std,year:+v.year,date:v.date,firm:v.firm,type:v.type,result:v.result,src:v.src,ncs:[]})})},
 editAudit(id){const a=find(id);if(!a)return;dlg(`<h3>✏ ${esc(a.std)} ${esc(a.year)}</h3><div class="g">${fld('date',T('日期','Date'),a.date)}${fld('firm',T('驗廠公司','Audit firm'),a.firm)}${fld('type',T('類型','Type'),a.type)}${fld('certTo',T('證書到期','Certificate valid to'),a.certTo)}</div>${fld('result',T('結果','Result'),a.result)}${fld('src',T('來源檔','Source'),a.src)}`,v=>{save(Object.assign({},a,v))})},
 delAudit(id){const a=find(id);if(!a||!confirm(T(`刪除 ${a.std} ${a.year} 這次驗廠？`,`Delete ${a.std} ${a.year}?`)))return;const M=getM();M[id]={id,deleted:true,updatedAt:NOW()};putM(M);render()},
 addNc(id){this.editNc(id,-1)},
 editNc(id,i){const a=find(id);if(!a)return;const n=i>=0?a.ncs[i]:{no:'NC'+((a.ncs||[]).length+1),rating:'Minor',status:'open'};dlg(`<h3>${i>=0?'✏':'＋'} NC · ${esc(a.std)} ${esc(a.year)}</h3><div class="g">${fld('no','#',n.no)}${fld('rating',T('等級','Rating'),n.rating,['Critical','Major','Minor','Observation'])}${fld('clause',T('條款','Clause'),n.clause)}${fld('due',T('期限','Due'),n.due)}${fld('status',T('狀態','Status'),n.status||'open',['open','closed'])}${fld('topic',T('主題（空白＝自動）','Topic (blank = auto)'),n.topic||'',['',...TOPICS.map(t=>t[0])])}</div>${fld('desc',T('問題','Finding'),n.desc,'area')}${fld('cap','CAP',n.cap,'area')}${fld('dispute',T('工廠不同意／爭議理由（空白＝無）','Dispute reason (blank = none)'),n.dispute,'area')}`,v=>{const b=Object.assign({},a,{ncs:(a.ncs||[]).slice()});if(i>=0)b.ncs[i]=Object.assign({},n,v);else b.ncs.push(v);save(b)})},
 delNc(id,i){const a=find(id);if(!a||!confirm(T('刪除這條 NC？','Delete this NC?')))return;const b=Object.assign({},a,{ncs:a.ncs.filter((_,k)=>k!==i)});save(b)},
 toggle(id,i){const a=find(id);if(!a)return;const b=Object.assign({},a,{ncs:a.ncs.slice()});b.ncs[i]=Object.assign({},b.ncs[i],{status:b.ncs[i].status==='open'?'closed':'open'});save(b)},
 exportX(){if(!window.XLSX){toast('XLSX ✗');return}const rows=[];audits().forEach(a=>(a.ncs||[]).forEach(n=>rows.push({Standard:a.std,Year:a.year,Date:a.date||'',Firm:a.firm||'',No:n.no,Rating:n.rating,Clause:n.clause||'',Topic:TN(topicOf(n)),Finding:n.desc||'',CAP:n.cap||'',Due:n.due||'',Status:n.status||''})));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'NC');XLSX.writeFile(wb,'VRT_Audit_NC_'+new Date().toISOString().slice(0,10)+'.xlsx')}
};
/* 匯入：本頁匯出的 Excel，或驗廠公司的 CAP 表（找含 Clause／Non-Conformance 欄的列） */
document.getElementById('imp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{let rows=[];if(/\.json$/i.test(f.name)){const d=JSON.parse(await f.text());rows=Array.isArray(d)?d:[]}else{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});wb.SheetNames.forEach(sn=>{const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});let hi=a.findIndex(r=>r.some(c=>/clause|standard/i.test(String(c)))&&r.some(c=>/non.?conform|finding|description/i.test(String(c))));if(hi<0)return;const H=a[hi].map(c=>String(c).toLowerCase());const col=re=>H.findIndex(h=>re.test(h));const cC=col(/clause/),cD=col(/non.?conform|finding|description/),cA=col(/corrective|cap/),cDue=col(/due/),cS=col(/standard/),cY=col(/^year/),cR=col(/rating|level/),cN=col(/^no|#/),cSt=col(/status|closed/);a.slice(hi+1).forEach(r=>{if(!String(r[cD]||'').trim())return;rows.push({Standard:cS>=0?r[cS]:'',Year:cY>=0?r[cY]:'',No:cN>=0?r[cN]:'',Rating:cR>=0?r[cR]:(/major/i.test(r[cC])?'Major':/minor/i.test(r[cC])?'Minor':''),Clause:String(r[cC]||'').replace(/\((major|minor)\)/i,'').trim(),Finding:r[cD],CAP:cA>=0?r[cA]:'',Due:cDue>=0?String(r[cDue]):'',Status:cSt>=0&&/close|yes/i.test(String(r[cSt]))?'closed':'open'})})})}
  if(!rows.length){toast(T('檔案裡找不到 NC 欄位','No NC columns found'));return}
  let std=rows[0].Standard,yr=rows[0].Year;if(!std)std=(prompt(T('這份 CAP 是哪個標準？（WRAP／GRS／WSE）','Which standard? (WRAP / GRS / WSE)'),/wse/i.test(f.name)?'WSE':/grs/i.test(f.name)?'GRS':'WRAP')||'').trim().toUpperCase();if(!yr)yr=(prompt(T('年度？','Year?'),String(new Date().getFullYear()))||'').trim();if(!std||!/^\d{4}$/.test(String(yr)))return;
  const M=getM();let add=0,upd=0;const groups={};rows.forEach(r=>{const s=String(r.Standard||std).toUpperCase(),y=+(r.Year||yr);(groups[s+'-'+y]=groups[s+'-'+y]||{s,y,rows:[]}).rows.push(r)});
  Object.values(groups).forEach(g=>{const id=g.s+'-'+g.y;const a=Object.assign({id,std:g.s,year:g.y,ncs:[]},find(id)||{});const ncs=(a.ncs||[]).slice();g.rows.forEach(r=>{const n={no:String(r.No||''),rating:r.Rating||'Minor',clause:String(r.Clause||''),desc:String(r.Finding||''),cap:String(r.CAP||''),due:String(r.Due||''),status:r.Status||'open'};const k=ncs.findIndex(x=>(x.no&&x.no===n.no)||(x.clause===n.clause&&String(x.desc).slice(0,40)===n.desc.slice(0,40)));if(k>=0){ncs[k]=Object.assign({},ncs[k],n);upd++}else{ncs.push(n);add++}});a.ncs=ncs;a.updatedAt=NOW();delete a._seed;M[id]=a});putM(M);render();toast(T(`匯入：新增 ${add}，更新 ${upd}`,`Imported: ${add} new, ${upd} updated`))}catch(err){toast('❌ '+err.message)}};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem('ac_audit_lang',LANG)}catch(e){}render()});
window.NCimport=function(A,SC){const M=getM();let a=0,b=0;(A||[]).forEach(x=>{if(!x||!x.id)return;const o=M[x.id];M[x.id]=Object.assign({},x,o&&o.updatedAt&&o.manual?o:{},{updatedAt:NOW()});a++});putM(M);const S=getS();(SC||[]).forEach(x=>{if(!x||!x.id)return;const o=S[x.id];S[x.id]=Object.assign({},x,o?{status:o.status,note:o.note}:{},{updatedAt:NOW()});b++});putS(S);render();return a+'/'+b};
render();
if(window.ACAuto&&window.ACTS){try{ACAuto.init({keys:[K,KS],by:'audit_nc',badge:false,onPull:()=>{render();document.getElementById('sync').textContent='☁ ✓ '+new Date().toTimeString().slice(0,5)}})}catch(e){console.warn('[nc] autosync',e)}}
})();
