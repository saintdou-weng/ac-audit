<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VRT BIG W / WSE Technical Audit Readiness Tracker + Fixed Direct Answer / Form / Flow Center</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17202a;--muted:#667085;--line:#d9dee7;--accent:#155eef;--good:#18864b;--bad:#c4320a;--warn:#b54708;--na:#667085;--critical:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Khmer","Khmer OS System",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1500px;margin:auto;padding:16px}.topbar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#101828;color:#fff;padding:18px 20px;border-radius:14px}.title h1{font-size:22px;margin:0 0 5px}.title p{margin:0;color:#d0d5dd;font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:#1d2939;border-radius:8px;padding:9px 12px;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{background:#fff5f3;color:var(--bad);border-color:#fecdca}.btn.dark{background:#344054;color:#fff;border-color:#344054}.lang-btn.active{background:#84adff;color:#102a56;border-color:#84adff}.notice{margin:12px 0;padding:11px 14px;background:#fffaeb;border:1px solid #fedf89;border-radius:10px;font-size:13px}.meta{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:10px;background:var(--card);padding:14px;border-radius:12px;border:1px solid var(--line)}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:#fff}.dashboard{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px;margin:12px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px}.stat .k{font-size:12px;color:var(--muted);font-weight:700}.stat .v{font-size:25px;font-weight:800;margin-top:5px}.stat.good .v{color:var(--good)}.stat.bad .v{color:var(--bad)}.stat.warn .v{color:var(--warn)}.layout{display:grid;grid-template-columns:280px 1fr;gap:12px}.sidebar,.main{min-width:0}.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.panel h3{margin:0 0 10px;font-size:15px}.section-link{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:7px;color:#344054}.section-link:hover{background:#f2f4f7}.mini-bar{height:6px;background:#eaecf0;border-radius:5px;overflow:hidden;margin-top:4px}.mini-bar span{display:block;height:100%;background:var(--good)}.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.filters input,.filters select{padding:9px;border:1px solid var(--line);border-radius:8px}.search{flex:1;min-width:220px}.section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}.section-head{padding:14px 16px;background:#f9fafb;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.section-head h2{font-size:17px;margin:0}.section-body{padding:10px}.question{border:1px solid var(--line);border-left:5px solid #98a2b3;border-radius:10px;margin:9px 0;background:#fff}.question.critical{border-left-color:var(--critical)}.qhead{padding:12px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.qid{font-weight:800;color:var(--accent);margin-right:5px}.qtext{font-weight:700;line-height:1.5}.badge{display:inline-block;font-size:11px;padding:3px 6px;border-radius:12px;background:#f2f4f7;color:#475467;margin-left:5px}.badge.critical{background:#fef3f2;color:#b42318}.guidance{font-size:12px;color:#475467;margin-top:5px;line-height:1.5}.status-row{display:flex;gap:6px;flex-wrap:wrap;min-width:300px;justify-content:flex-end}.status-btn{padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:700}.status-btn.active.done{background:#ecfdf3;border-color:#6ce9a6;color:#027a48}.status-btn.active.pending{background:#fff4ed;border-color:#f9dbaf;color:#b93815}.status-btn.active.na{background:#f2f4f7;color:#475467}.status-btn.active.unassessed{background:#fffaeb;color:#b54708}.qbody{border-top:1px solid #eaecf0;padding:12px;display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.checks{display:grid;gap:7px}.check-line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px;background:#f9fafb;border-radius:7px;font-size:13px}.check-line select{padding:6px;border:1px solid var(--line);border-radius:6px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail-grid .wide{grid-column:1/-1}.detail-grid textarea,.detail-grid input{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px}.detail-grid label{font-size:11px;color:var(--muted);font-weight:700}.hidden{display:none!important}.report{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}.report h1,.report h2,.report h3{color:#101828}.report table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}.report th,.report td{border:1px solid #d0d5dd;padding:7px;vertical-align:top}.report th{background:#f2f4f7}.report .r-good{color:#027a48;font-weight:700}.report .r-bad{color:#b42318;font-weight:700}.report-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.footer{font-size:12px;color:var(--muted);text-align:center;padding:16px}@media(max-width:1050px){.meta{grid-template-columns:repeat(3,1fr)}.dashboard{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.sidebar{display:none}.qbody{grid-template-columns:1fr}.qhead{flex-direction:column}.status-row{justify-content:flex-start;min-width:0}}@media(max-width:600px){.app{padding:8px}.meta{grid-template-columns:1fr 1fr}.dashboard{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr}.detail-grid .wide{grid-column:auto}.status-btn{font-size:11px;padding:6px}.title h1{font-size:18px}}

.mobile-tools{display:none;margin:10px 0;gap:8px;flex-wrap:wrap}.mobile-tools .btn{flex:1;min-width:120px}@media(max-width:1050px){.mobile-tools{display:flex}}
@media print{body{background:#fff}.no-print,.topbar,.notice,.meta,.dashboard,.layout>.sidebar,.filters,.questionnaire-view,.footer{display:none!important}.app{max-width:none;padding:0}.report{border:0;padding:0}.report-toolbar{display:none}.report table{font-size:10px;page-break-inside:auto}.report tr{page-break-inside:avoid}}

/* ===== Integrated Document / SOP Library ===== */
.doc-link{display:inline-flex;align-items:center;gap:5px;border:1px solid #b2ccff;background:#eff4ff;color:#1849a9;border-radius:7px;padding:5px 8px;font-size:11px;font-weight:800;margin-left:5px;cursor:pointer}
.doc-modal{position:fixed;inset:0;z-index:9999;background:rgba(16,24,40,.72);display:none;align-items:stretch;justify-content:center;padding:12px}
.doc-modal.open{display:flex}
.doc-shell{width:min(1500px,100%);height:calc(100vh - 24px);background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.doc-top{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 14px;background:#101828;color:#fff}
.doc-top h2{margin:0;font-size:17px}.doc-top .doc-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.doc-top button,.doc-top input{border:1px solid #667085;border-radius:7px;padding:7px 9px}.doc-top button{cursor:pointer;font-weight:700}
.doc-body{flex:1;min-height:0;display:grid;grid-template-columns:320px 1fr}
.doc-list{border-right:1px solid #eaecf0;overflow:auto;padding:10px;background:#f9fafb}
.doc-card{border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:10px;margin-bottom:8px;cursor:pointer}
.doc-card:hover,.doc-card.active{border-color:#528bff;background:#eff4ff}
.doc-card .dt{font-weight:800;font-size:13px}.doc-card .dm{font-size:11px;color:#667085;margin-top:5px}
.doc-view{min-width:0;overflow:auto;padding:14px;background:#f2f4f7}
.doc-cover{background:#fff;border:1px solid #d0d5dd;border-radius:12px;padding:14px;margin-bottom:12px}
.doc-cover h3{margin:0 0 6px}.doc-cover p{margin:5px 0;color:#475467;font-size:13px}
.doc-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.doc-thumb{background:#fff;border:1px solid #d0d5dd;border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.doc-thumb img{display:block;width:100%;height:210px;object-fit:contain;background:#fff}
.doc-thumb div{padding:7px;font-size:11px;color:#475467;text-align:center}
.img-modal{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.92);display:none;flex-direction:column}
.img-modal.open{display:flex}.img-bar{display:flex;justify-content:space-between;gap:8px;align-items:center;color:#fff;padding:8px 10px;background:#111827}
.img-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:10px}
.img-stage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center}
.img-nav{display:flex;gap:6px}.img-bar button{border:1px solid #667085;background:#fff;color:#111827;border-radius:7px;padding:7px 10px;font-weight:800}
@media(max-width:850px){.doc-body{grid-template-columns:1fr}.doc-list{max-height:34vh;border-right:0;border-bottom:1px solid #eaecf0}.doc-modal{padding:0}.doc-shell{height:100vh;border-radius:0}.doc-thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}.doc-thumb img{height:190px}.doc-top{align-items:flex-start}.doc-top input{max-width:150px}}


/* ===== v4 Direct Document/SOP Tabs ===== */
.main-tabs{display:flex;gap:8px;margin:12px 0;position:sticky;top:0;z-index:90;background:var(--bg);padding:7px 0}
.main-tab{border:1px solid #d0d5dd;background:#fff;color:#344054;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}
.main-tab.active{background:#175cd3;color:#fff;border-color:#175cd3}
.library-pane{background:#fff;border:1px solid #d0d5dd;border-radius:12px;overflow:hidden;min-height:70vh}
.library-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px;background:#101828;color:#fff}
.library-head h2{margin:0 0 5px;font-size:18px}.library-head p{margin:0;color:#d0d5dd;font-size:12px}
.library-head input{min-width:260px;max-width:420px;width:38vw;border:1px solid #667085;border-radius:8px;padding:9px 10px}
.library-grid{display:grid;grid-template-columns:330px 1fr;min-height:68vh}
.library-left{background:#f9fafb;border-right:1px solid #eaecf0;padding:10px;overflow:auto;max-height:78vh}
.library-right{background:#f2f4f7;padding:14px;overflow:auto;max-height:78vh}
.lib-context{background:#eff8ff;border:1px solid #b2ddff;color:#175cd3;border-radius:9px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.lib-item{background:#fff;border:1px solid #d0d5dd;border-radius:9px;padding:10px;margin-bottom:8px;cursor:pointer}
.lib-item:hover,.lib-item.active{background:#eff4ff;border-color:#528bff}.lib-title{font-size:13px;font-weight:800}.lib-meta{font-size:11px;color:#667085;margin-top:4px}
.lib-cover{background:#fff;border:1px solid #d0d5dd;border-radius:11px;padding:14px;margin-bottom:12px}
.lib-cover h3{margin:0 0 7px}.lib-cover p{font-size:13px;color:#475467;line-height:1.5;margin:5px 0}
.related-items{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.audit-chip{border:1px solid #84adff;background:#eff4ff;color:#1849a9;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800;cursor:pointer}
.audit-chip:hover{background:#dbe8ff}
.lib-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.lib-thumb{background:#fff;border:1px solid #d0d5dd;border-radius:10px;overflow:hidden;cursor:pointer}
.lib-thumb img{width:100%;height:230px;object-fit:contain;background:#fff;display:block}.lib-thumb div{font-size:11px;color:#667085;padding:7px;text-align:center}
.flash-question{animation:flashQ 1.6s ease 2}@keyframes flashQ{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 5px rgba(23,92,211,.28)}}
@media(max-width:850px){.main-tabs{position:static}.library-grid{grid-template-columns:1fr}.library-left{max-height:32vh;border-right:0;border-bottom:1px solid #eaecf0}.library-right{max-height:none}.library-head{flex-direction:column}.library-head input{width:100%;max-width:none;min-width:0}.lib-thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}.lib-thumb img{height:190px}}


/* ===== v5 embedded WSE SOP / document text viewer ===== */
.doc-content{background:#fff;border:1px solid #d0d5dd;border-radius:12px;padding:18px;line-height:1.58}
.doc-headline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.doc-badge{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#f2f4f7;border:1px solid #d0d5dd;color:#344054}
.doc-badge.pc{background:#ecfdf3;border-color:#abefc6;color:#067647}
.doc-field{display:grid;grid-template-columns:135px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #eaecf0;font-size:13px}
.doc-field b{color:#344054}.doc-section{margin-top:18px}.doc-section h4{margin:0 0 8px;color:#101828;font-size:14px}
.doc-section ul{margin:0;padding-left:20px}.doc-section li{margin:6px 0}
.doc-source{margin-top:16px;padding:10px 12px;border-radius:8px;background:#fffaeb;border:1px solid #fedf89;color:#93370d;font-size:12px}
.pc-note{background:#ecfdf3;border:1px solid #abefc6;color:#067647;padding:10px 12px;border-radius:9px;margin:0 0 12px;font-weight:800}
@media(max-width:650px){.doc-field{grid-template-columns:1fr}.doc-content{padding:13px}}


/* ===== v6 Fixed Direct Answer / Form / Flow Center ===== */
.answer-mode .doc-body{display:block}
.answer-mode .doc-list{display:none}
.answer-mode .doc-view{height:100%;padding:16px;background:#f2f4f7}
.answer-wrap{max-width:1180px;margin:0 auto}
.answer-hero{background:#101828;color:#fff;border-radius:14px;padding:18px;margin-bottom:12px}
.answer-hero h2{margin:0 0 8px;font-size:20px}.answer-hero p{margin:5px 0;color:#e4e7ec;line-height:1.6}
.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.answer-card{background:#fff;border:1px solid #d0d5dd;border-radius:12px;padding:14px}
.answer-card h3{margin:0 0 9px;font-size:15px;color:#101828}
.answer-card ul{margin:0;padding-left:20px}.answer-card li{margin:6px 0;line-height:1.55}
.answer-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.answer-meta>div{background:#fff;border:1px solid #d0d5dd;border-radius:10px;padding:12px}
.answer-meta b{display:block;color:#475467;font-size:11px;margin-bottom:5px}
.pass-box{border-left:5px solid #12b76a;background:#ecfdf3}
.answer-table-wrap{overflow:auto;border:1px solid #d0d5dd;border-radius:10px}
.answer-table{width:100%;border-collapse:collapse;min-width:780px;background:#fff}
.answer-table th,.answer-table td{border:1px solid #eaecf0;padding:8px;font-size:12px;vertical-align:top}
.answer-table th{background:#f2f4f7;text-align:left}.answer-table td[contenteditable="true"]{min-height:26px}
.answer-table td[contenteditable="true"]:focus{outline:2px solid #84adff;background:#eff4ff}
.flow-row{display:flex;gap:8px;align-items:stretch;overflow:auto;padding-bottom:4px}
.flow-step{min-width:145px;flex:1;background:#eff4ff;border:1px solid #b2ccff;border-radius:10px;padding:10px;font-weight:800;font-size:12px;line-height:1.45}
.flow-arrow{align-self:center;color:#667085;font-size:18px;font-weight:900}
.form-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.form-toolbar button{border:1px solid #b2ccff;background:#fff;color:#1849a9;border-radius:7px;padding:7px 10px;font-weight:800;cursor:pointer}
.sop-ref{display:flex;flex-wrap:wrap;gap:7px}.sop-ref button{border:1px solid #d0d5dd;background:#f9fafb;border-radius:8px;padding:7px 9px;cursor:pointer;text-align:left}
.answer-link{display:inline-flex;align-items:center;gap:5px;border:1px solid #6ce9a6;background:#ecfdf3;color:#067647;border-radius:7px;padding:6px 10px;font-size:11px;font-weight:900;margin-left:5px;cursor:pointer}
.quick-note{background:#fffaeb;border:1px solid #fedf89;color:#93370d;border-radius:9px;padding:10px 12px;font-size:12px;line-height:1.5}
@media(max-width:800px){.answer-grid{grid-template-columns:1fr}.answer-meta{grid-template-columns:1fr}.answer-hero h2{font-size:17px}.answer-mode .doc-view{padding:9px}.flow-step{min-width:135px}}

</style>
</head>
<body>
<div class="app">
  <div class="topbar no-print">
    <div class="title"><h1>VRT BIG W / WSE Technical Audit Readiness Tracker + Fixed Direct Answer / Form / Flow Center</h1><p id="subtitle"></p></div>
    <div class="controls">
      <button class="btn lang-btn active" data-lang="zh">中文</button><button class="btn lang-btn" data-lang="en">English</button><button class="btn lang-btn" data-lang="km">ខ្មែរ</button>
      <button class="btn primary" id="docLibraryBtn" onclick="showMainTab('docs')">🔎 答案 / 表格庫</button>
      <button class="btn dark" id="exportBtn"></button><button class="btn dark" id="importBtn"></button><input id="importFile" type="file" accept=".json" hidden>
      <button class="btn danger" id="resetBtn"></button>
    </div>
  </div>
  <div class="notice" id="notice"></div>
<div class="notice no-print" style="background:#ecfdf3;border-color:#abefc6;color:#067647"><b>Direct View:</b> 點任何稽核項目的「直接看要求／表格／流程」，會直接切到同頁答案，不使用彈出視窗。</div>

  <div class="main-tabs no-print">
    <button class="main-tab active" id="tabTrackerBtn" onclick="showMainTab('tracker')">✅ WSE Audit Tracker</button>
    <button class="main-tab" id="tabDocsBtn" onclick="showMainTab('docs')">🔎 Answers / Forms</button>
  </div>

  <div id="trackerPane">
  <div class="meta no-print">
    <div class="field"><label id="factoryLbl"></label><input id="factory" value="Vantage River Textiles Co., Ltd. (VRT)"></div>
    <div class="field"><label id="auditDateLbl"></label><input id="auditDate" type="date" value="2026-09-07"></div>
    <div class="field"><label id="assessDateLbl"></label><input id="assessDate" type="date"></div>
    <div class="field"><label id="assessorLbl"></label><input id="assessor"></div>
    <div class="field"><label id="reportLangLbl"></label><select id="reportLang"><option value="zh">中文</option><option value="en">English</option></select></div>
    <div class="field"><label id="reportTitleLbl"></label><input id="reportTitle"></div>
  </div>
  <div class="dashboard no-print" id="dashboard"></div>
  <div class="mobile-tools no-print" id="mobileTools">
    <button class="btn primary" id="mobileDocLibraryBtn" onclick="showMainTab('docs')">🔎 答案 / 表格庫</button>
    <button class="btn primary" id="mobileReportBtn"></button>
    <button class="btn" id="mobilePrintBtn"></button>
    <button class="btn" id="mobileWordBtn"></button>
  </div>
  <div class="layout">
    <aside class="sidebar no-print"><div class="panel"><h3 id="sectionNavTitle"></h3><div id="sectionNav"></div></div><div class="panel"><h3 id="dataToolsTitle"></h3><button class="btn primary" id="reportBtn" style="width:100%;margin-bottom:7px"></button><button class="btn" id="printBtn" style="width:100%;margin-bottom:7px"></button><button class="btn" id="wordBtn" style="width:100%"></button></div></aside>
    <main class="main">
      <div class="questionnaire-view" id="questionnaireView">
        <div class="filters no-print"><input class="search" id="search" type="search"><select id="filter"><option value="all"></option><option value="open"></option><option value="critical"></option><option value="unassessed"></option><option value="overdue"></option></select><button class="btn" id="expandOpenBtn"></button></div>
        <div id="questions"></div>
      </div>
      <div id="reportView" class="report hidden"></div>
    </main>
  </div>

  </div>
  <section id="libraryPane" class="library-pane hidden no-print">
    <div class="library-head">
      <div>
        <h2 id="libraryTitle">📚 VRT Document / SOP Library</h2>
        <p id="librarySubtitle">Direct viewer linked to WSE audit items</p>
      </div>
      <input id="pageDocSearch" type="search" placeholder="Search / 搜尋 / ស្វែងរក" oninput="renderDocsPage()">
    </div>
    <div class="library-grid">
      <aside class="library-left">
        <div id="pageDocContext"></div>
        <div id="pageDocList"></div>
      </aside>
      <main class="library-right" id="pageDocView"></main>
    </div>
  </section>



  <div class="footer" id="footer"></div>
</div>

function showMainTab(tab,itemId=null){
  const tracker=document.getElementById('trackerPane');
  const docs=document.getElementById('libraryPane');
  const tb1=document.getElementById('tabTrackerBtn');
  const tb2=document.getElementById('tabDocsBtn');
  if(tab==='docs'){
    tracker.classList.add('hidden');
    docs.classList.remove('hidden');
    tb1.classList.remove('active');
    tb2.classList.add('active');
    pageDocContextItem=itemId||null;
    if(itemId && ITEMS.find(x=>x.id===itemId)){
      activeDocId=itemId;
    }else if(!ITEMS.find(x=>x.id===activeDocId)){
      activeDocId=(ITEMS[0]||{}).id||null;
    }
    renderDocsPage();
    try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){window.scrollTo(0,0)}
  }else{
    docs.classList.add('hidden');
    tracker.classList.remove('hidden');
    tb2.classList.remove('active');
    tb1.classList.add('active');
    pageDocContextItem=null;
  }
}

function pageDocs(){
  const item=pageDocContextItem?ITEMS.find(x=>x.id===pageDocContextItem):null;
  const base=item?docsForItem(item):DOCLIB;
  const q=norm(document.getElementById('pageDocSearch').value);
  if(!q)return base;
  return base.filter(d=>norm(d.id+' '+L(d.title)+' '+L(d.note)+' '+d.type+' '+(d.terms||[]).join(' ')).includes(q));
}

function jumpToAudit(itemId){
  showMainTab('tracker');document.getElementById('filter').value='all';document.getElementById('search').value='';renderQuestions();
  setTimeout(()=>{const el=document.getElementById('q-'+itemId);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash-question');setTimeout(()=>el.classList.remove('flash-question'),3200)}},80);
}

const KEY='vrt_bigw_wse_tracker_v1';
let lang='zh';
let state={meta:{factory:'Vantage River Textiles Co., Ltd. (VRT)',auditDate:'2026-09-07',assessDate:new Date().toISOString().slice(0,10),assessor:'',reportLang:'zh',reportTitle:''},responses:{}};
function emptyResp(){return{status:'unassessed',checks:['unassessed','unassessed','unassessed'],reason:'',action:'',owner:'',due:'',evidence:'',open:false}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.responses){state=s}}catch(e){} ITEMS.forEach(i=>{if(!state.responses[i.id])state.responses[i.id]=emptyResp()}); if(!state.meta.assessDate)state.meta.assessDate=new Date().toISOString().slice(0,10)}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function t(k){return UI[lang][k]||k}
function secName(code,l=lang){const s=SECTIONS.find(x=>x[0]===code);return s? s[l==='zh'?1:l==='en'?2:3]:code}
function response(id){return state.responses[id]||(state.responses[id]=emptyResp())}
function effective(item){const r=response(item.id);if(r.status==='na')return'na';if(r.status==='unassessed')return'unassessed';if(r.status==='pending')return'pending';if(r.status==='done'&&r.checks.every(x=>x==='done'||x==='na'))return'done';return'partial'}
function isOverdue(r){return r.due&&r.status!=='done'&&r.status!=='na'&&new Date(r.due+'T23:59:59')<new Date()}
function metrics(list=ITEMS){let applicable=0,done=0,assessed=0,condApp=0,condDone=0,criticalOpen=0,open=0,overdue=0;list.forEach(i=>{const r=response(i.id),e=effective(i);if(r.status!=='na'){applicable++;if(e==='done')done++;if(r.status!=='unassessed')assessed++;if(e!=='done')open++;if(i.critical&&e!=='done')criticalOpen++;if(isOverdue(r))overdue++}r.checks.forEach(c=>{if(c!=='na'){condApp++;if(c==='done')condDone++}})});return{applicable,done,assessed,condApp,condDone,criticalOpen,open,overdue,rate:applicable?Math.round(done/applicable*100):0,assessRate:applicable?Math.round(assessed/applicable*100):0,condRate:condApp?Math.round(condDone/condApp*100):0}}
function syncMeta(){['factory','auditDate','assessDate','assessor','reportLang','reportTitle'].forEach(k=>{const el=document.getElementById(k);if(el){state.meta[k]=el.value}});save()}
function setMeta(){['factory','auditDate','assessDate','assessor','reportLang','reportTitle'].forEach(k=>{const el=document.getElementById(k);if(el)el.value=state.meta[k]||''});if(!state.meta.reportTitle)document.getElementById('reportTitle').placeholder=t('defaultReportTitle')}

function renderDashboard(){const m=metrics();const audit=state.meta.auditDate?new Date(state.meta.auditDate+'T00:00:00'):null;const days=audit?Math.ceil((audit-new Date())/86400000):'-';const cards=[['applicable',m.applicable,''],['done',m.done,'good'],['rate',m.rate+'%','good'],['conditions',m.condRate+'%',''],['assessed',m.assessRate+'%',''],['criticalOpen',m.criticalOpen,'bad'],['openCount',m.open,'warn'],['overdueCount',m.overdue,m.overdue?'bad':''],['days',days+' '+t('daysUnit'),days<14?'warn':'']];document.getElementById('dashboard').innerHTML=cards.map(c=>`<div class="stat ${c[2]}"><div class="k">${t(c[0])}</div><div class="v">${c[1]}</div></div>`).join('')}
function renderNav(){document.getElementById('sectionNav').innerHTML=SECTIONS.map(s=>{const arr=ITEMS.filter(i=>i.section===s[0]),m=metrics(arr);return`<button class="section-link" onclick="document.getElementById('sec-${s[0]}').scrollIntoView({behavior:'smooth'})"><b>${s[0]}. ${esc(secName(s[0]))}</b><div>${m.done}/${m.applicable} · ${m.rate}%</div><div class="mini-bar"><span style="width:${m.rate}%"></span></div></button>`}).join('')}
function statusLabel(e){return e==='done'?t('complete'):e==='pending'?t('incomplete'):e==='na'?t('na'):e==='partial'?t('partial'):t('notassessed')}
function renderQuestions(){const q=document.getElementById('search').value.trim().toLowerCase(),filter=document.getElementById('filter').value;let totalShown=0;const out=[];SECTIONS.forEach(s=>{let arr=ITEMS.filter(i=>i.section===s[0]).filter(i=>{const r=response(i.id),e=effective(i),hay=(i.id+' '+i.source+' '+i.q.zh+' '+i.q.en+' '+i.q.km+' '+i.guide.zh+' '+i.guide.en+' '+i.guide.km).toLowerCase();if(q&&!hay.includes(q))return false;if(filter==='open'&&(e==='done'||e==='na'))return false;if(filter==='critical'&&!i.critical)return false;if(filter==='unassessed'&&r.status!=='unassessed')return false;if(filter==='overdue'&&!isOverdue(r))return false;return true});if(!arr.length)return;totalShown+=arr.length;const sm=metrics(ITEMS.filter(i=>i.section===s[0]));out.push(`<section class="section" id="sec-${s[0]}"><div class="section-head"><h2>${s[0]}. ${esc(secName(s[0]))}</h2><b>${t('sectionRate')}: ${sm.rate}%</b></div><div class="section-body">${arr.map(renderQuestion).join('')}</div></section>`)});document.getElementById('questions').innerHTML=totalShown?out.join(''):`<div class="panel">${t('noOpen')}</div>`}
function renderQuestion(item){const r=response(item.id),e=effective(item);const show=r.open||r.status==='pending'||e==='partial';return`<article class="question ${item.critical?'critical':''}" id="q-${item.id}"><div class="qhead"><div><div class="qtext"><span class="qid">${item.id}</span>${esc(item.q[lang])}${item.critical?`<span class="badge critical">${t('criticalTag')}</span>`:''}</div><div class="guidance">${esc(item.guide[lang])}</div><div class="guidance"><span class="badge">${t('source')}: ${esc(item.source)}</span> <span class="badge">${t('systemStatus')}: ${statusLabel(e)}</span>${docButton(item)}</div></div><div class="status-row">${['done','pending','na','unassessed'].map(st=>`<button class="status-btn ${st} ${r.status===st?'active':''}" onclick="setStatus('${item.id}','${st}')">${st==='done'?t('complete'):st==='pending'?t('incomplete'):st==='na'?t('na'):t('notassessed')}</button>`).join('')}<button class="status-btn" onclick="toggleOpen('${item.id}')">${show?'−':'+'}</button></div></div><div class="qbody ${show?'':'hidden'}"><div><h4 style="margin:0 0 8px">${t('confirm')}</h4><div class="checks">${COMMON_CHECKS.map((c,idx)=>`<div class="check-line"><span>${esc(c[lang])}</span><select onchange="setCheck('${item.id}',${idx},this.value)"><option value="unassessed" ${r.checks[idx]==='unassessed'?'selected':''}>${t('notassessed')}</option><option value="done" ${r.checks[idx]==='done'?'selected':''}>${t('conditionDone')}</option><option value="pending" ${r.checks[idx]==='pending'?'selected':''}>${t('conditionPending')}</option><option value="na" ${r.checks[idx]==='na'?'selected':''}>${t('conditionNA')}</option></select></div>`).join('')}</div></div><div class="detail-grid"><div class="wide"><label>${t('reason')}</label><textarea rows="2" onchange="setField('${item.id}','reason',this.value)">${esc(r.reason)}</textarea></div><div class="wide"><label>${t('action')}</label><textarea rows="2" onchange="setField('${item.id}','action',this.value)">${esc(r.action)}</textarea></div><div><label>${t('owner')}</label><input value="${esc(r.owner)}" onchange="setField('${item.id}','owner',this.value)"></div><div><label>${t('due')}</label><input type="date" value="${esc(r.due)}" onchange="setField('${item.id}','due',this.value)"></div><div class="wide"><label>${t('evidence')}</label><textarea rows="2" onchange="setField('${item.id}','evidence',this.value)">${esc(r.evidence)}</textarea></div></div></div></article>`}
function setStatus(id,st){const r=response(id);r.status=st;r.open=st==='pending';if(st==='done'&&r.checks.every(x=>x==='unassessed'))r.checks=['done','done','done'];if(st==='na')r.checks=['na','na','na'];save();refresh()}
function setCheck(id,idx,val){const r=response(id);r.checks[idx]=val;if(val==='pending'&&r.status==='done')r.status='pending';save();refresh(false)}
function setField(id,k,v){response(id)[k]=v;save();renderDashboard();renderNav()}
function toggleOpen(id){response(id).open=!response(id).open;save();renderQuestions()}
function refresh(full=true){syncMeta();renderDashboard();renderNav();if(full)renderQuestions();else renderQuestions()}
function reportData(l){const m=metrics();const now=new Date();const fmt=d=>d||'-';const title=state.meta.reportTitle||UI[l].defaultReportTitle;const critical=ITEMS.filter(i=>i.critical&&effective(i)!=='done'&&effective(i)!=='na');const open=ITEMS.filter(i=>!['done','na'].includes(effective(i)));let html=`<div class="report-toolbar no-print"><button class="btn" onclick="backToForm()">${UI[lang].reportBack}</button><button class="btn primary" onclick="window.print()">${UI[lang].print}</button><button class="btn" onclick="downloadWord()">${UI[lang].word}</button></div><h1>${esc(title)}</h1><p><b>${UI[l].generated}:</b> ${now.toLocaleString()}<br><b>${UI[l].disclaimer}</b></p><h2>${UI[l].reportSummary}</h2><p>${l==='zh'?`本次共評估 ${m.applicable} 個適用主項，完成 ${m.done} 項，主項完成率 ${m.rate}%；評估覆蓋率 ${m.assessRate}%；確認條件完成率 ${m.condRate}%。目前有 ${m.open} 項未完成或未評估，其中 ${m.criticalOpen} 項屬高風險，${m.overdue} 項改善行動已逾期。`:`This assessment includes ${m.applicable} applicable main items, of which ${m.done} are complete. Main completion is ${m.rate}%, assessment coverage is ${m.assessRate}%, and confirmation-condition completion is ${m.condRate}%. There are ${m.open} incomplete or unassessed items, including ${m.criticalOpen} critical-risk items and ${m.overdue} overdue actions.`}</p><h2>${UI[l].reportScope}</h2><table><tr><th>${UI[l].factory}</th><td>${esc(state.meta.factory)}</td><th>${UI[l].auditDate}</th><td>${fmt(state.meta.auditDate)}</td></tr><tr><th>${UI[l].assessDate}</th><td>${fmt(state.meta.assessDate)}</td><th>${UI[l].assessor}</th><td>${esc(state.meta.assessor||'-')}</td></tr></table><h2>${UI[l].reportSection}</h2><table><tr><th>Section</th><th>${UI[l].applicable}</th><th>${UI[l].done}</th><th>${UI[l].rate}</th></tr>${SECTIONS.map(s=>{const sm=metrics(ITEMS.filter(i=>i.section===s[0]));return`<tr><td>${s[0]}. ${esc(secName(s[0],l))}</td><td>${sm.applicable}</td><td>${sm.done}</td><td>${sm.rate}%</td></tr>`}).join('')}</table><h2>${UI[l].reportCritical}</h2>${critical.length?`<table><tr><th>ID</th><th>Requirement</th><th>${UI[l].status}</th><th>${UI[l].action}</th><th>${UI[l].owner}</th><th>${UI[l].due}</th></tr>${critical.map(i=>rowOpen(i,l)).join('')}</table>`:`<p>${UI[l].noCritical}</p>`}<h2>${UI[l].reportOpen}</h2>${open.length?`<table><tr><th>ID</th><th>Requirement</th><th>${UI[l].status}</th><th>${UI[l].reason}</th><th>${UI[l].action}</th><th>${UI[l].owner}</th><th>${UI[l].due}</th></tr>${open.map(i=>rowOpen(i,l,true)).join('')}</table>`:`<p>${UI[l].noAction}</p>`}<h2>${UI[l].reportDetail}</h2><table><tr><th>ID</th><th>Requirement</th><th>${UI[l].status}</th><th>${UI[l].confirm}</th><th>${UI[l].evidence}</th><th>${UI[l].source}</th></tr>${ITEMS.map(i=>{const r=response(i.id),e=effective(i);return`<tr><td>${i.id}${i.critical?' ⚠':''}</td><td>${esc(i.q[l])}<br><small>${esc(i.guide[l])}</small></td><td class="${e==='done'?'r-good':e==='na'?'':'r-bad'}">${statusText(e,l)}</td><td>${r.checks.map((x,n)=>`${n+1}. ${statusText(x,l)}`).join('<br>')}</td><td>${esc(r.evidence||'-')}</td><td>${esc(i.source)}</td></tr>`}).join('')}</table><p><b>${UI[l].disclaimer}</b></p>`;return html}
function statusText(st,l){const u=UI[l];return st==='done'?u.complete:st==='pending'?u.incomplete:st==='na'?u.na:st==='partial'?u.partial:u.notassessed}
function rowOpen(i,l,full=false){const r=response(i.id),e=effective(i);return`<tr><td>${i.id}${i.critical?' ⚠':''}</td><td>${esc(i.q[l])}</td><td>${statusText(e,l)}</td>${full?`<td>${esc(r.reason||'-')}</td>`:''}<td>${esc(r.action||'-')}</td><td>${esc(r.owner||'-')}</td><td>${esc(r.due||'-')}</td></tr>`}
function showReport(){syncMeta();const l=state.meta.reportLang||'zh';document.getElementById('questionnaireView').classList.add('hidden');const v=document.getElementById('reportView');v.innerHTML=reportData(l);v.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function backToForm(){document.getElementById('reportView').classList.add('hidden');document.getElementById('questionnaireView').classList.remove('hidden')}
function downloadWord(){syncMeta();const l=state.meta.reportLang||'zh';const body=reportData(l).replace(/<div class="report-toolbar[\s\S]*?<\/div>/,'');const doc=`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:Arial,sans-serif}table{border-collapse:collapse;width:100%;font-size:10pt}th,td{border:1px solid #777;padding:5px;vertical-align:top}th{background:#eee}h1,h2{color:#17365d}</style></head><body>${body}
</body></html>`;const blob=new Blob(['\ufeff',doc],{type:'application/msword'});downloadBlob(blob,`VRT_BIGW_WSE_Report_${state.meta.assessDate||'date'}_${l}.doc`)}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportData(){syncMeta();downloadBlob(new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}),`VRT_BIGW_WSE_Tracker_${state.meta.assessDate||'data'}.json`)}
function importData(file){const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.responses)throw 0;state={meta:{...state.meta,...d.meta},responses:d.responses};ITEMS.forEach(i=>{if(!state.responses[i.id])state.responses[i.id]=emptyResp()});save();setMeta();refresh();alert(t('importOk'))}catch(e){alert(t('importBad'))}};rd.readAsText(file)}
function init(){load();applyUi();setMeta();refresh();document.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;applyUi();setMeta();refresh();if(!document.getElementById('libraryPane').classList.contains('hidden'))renderDocsPage()});['factory','auditDate','assessDate','assessor','reportLang','reportTitle'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{syncMeta();renderDashboard()}));document.getElementById('search').addEventListener('input',renderQuestions);document.getElementById('filter').addEventListener('change',renderQuestions);document.getElementById('expandOpenBtn').onclick=()=>{ITEMS.forEach(i=>response(i.id).open=!['done','na'].includes(effective(i)));save();renderQuestions()};document.getElementById('reportBtn').onclick=showReport;document.getElementById('printBtn').onclick=()=>{showReport();setTimeout(()=>window.print(),150)};document.getElementById('wordBtn').onclick=downloadWord;document.getElementById('mobileReportBtn').onclick=showReport;document.getElementById('mobilePrintBtn').onclick=()=>{showReport();setTimeout(()=>window.print(),150)};document.getElementById('mobileWordBtn').onclick=downloadWord;document.getElementById('exportBtn').onclick=exportData;document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>e.target.files[0]&&importData(e.target.files[0]);document.getElementById('resetBtn').onclick=()=>{if(confirm(t('confirmReset'))){localStorage.removeItem(KEY);location.reload()}}}
init();
</script>
</body>
</html>
