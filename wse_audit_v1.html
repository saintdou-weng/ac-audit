<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>WSE 稽核 · AC Audit</title>
<style>
:root{--bg:#f6f3eb;--card:#fff;--ink:#202631;--muted:#7b8190;--line:#ddd7ca;--green:#2f8a68;--gold:#b49b70;--red:#c74a55}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,"Noto Sans TC","Noto Sans Khmer",sans-serif;background:var(--bg);color:var(--ink)}.app{height:100%;display:flex;flex-direction:column}.head{background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:9px;min-height:60px;flex-wrap:wrap}.home{text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-weight:800;background:#fff}.brand{display:flex;align-items:center;gap:8px;min-width:210px}.ico{font-size:25px}.ttl{font-size:15px;font-weight:900}.sub{font-size:10px;color:var(--muted);margin-top:2px}.tools{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:#f8f8f6;border-radius:999px;padding:6px 9px;font-size:10px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:#aaa}.dot.ok{background:#44bd83}.dot.wait{background:#f0b53c}.dot.bad{background:#e05c65}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 9px;font-weight:800;color:var(--ink);cursor:pointer}.btn:hover{background:#f4f0e8}.tabs{display:flex;gap:0;background:#fff;border-bottom:1px solid var(--line);overflow:auto;padding:0 8px}.tab{border:0;border-bottom:3px solid transparent;background:#fff;padding:11px 14px;font-weight:800;white-space:nowrap;color:#59606d;cursor:pointer}.tab.on{color:var(--ink);border-bottom-color:var(--gold)}.frame{flex:1;min-height:0;border:0;width:100%;background:#fff}#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 14px;background:#17243c;color:#fff;border-radius:8px;font-size:11px;opacity:0;pointer-events:none;transition:.2s;z-index:99999}#toast.on{opacity:1}
@media(max-width:650px){.head{padding:7px 8px}.brand{min-width:0;flex:1}.tools{width:100%;margin-left:0}.tools .btn{flex:1}.chip{margin-left:auto}.sub{display:none}.tab{padding:10px 11px;font-size:12px}}
</style></head><body><div class="app"><div class="head"><a class="home" href="ac_audit_platform_v1.html">← AC Audit</a><div class="brand"><div class="ico">📋</div><div><div class="ttl" id="title">WSE 稽核</div><div class="sub">WSE Audit · VRT</div></div></div><div class="tools"><div class="chip"><span class="dot" id="dot"></span><span id="cmsg">Cloud</span></div><button class="btn" onclick="up()">☁↑</button><button class="btn" onclick="down()">☁↓</button><button class="btn" onclick="sync()">⟳</button></div></div><div class="tabs" id="tabs"></div><iframe class="frame" id="f" title="WSE Audit"></iframe></div><div id="toast"></div>
<script>
const TABS=[{"id":"legacy","zh":"WSE 原版評估","en":"Original WSE","km":"WSE Original","icon":"📋","src":"WSE_Audit_Assessment_v1.html"},{"id":"bigw","zh":"BIG W / WSE Tracker","en":"BIG W / WSE Tracker","km":"BIG W / WSE","icon":"🧭","src":"WSE_BIGW_Tracker_v7_1.html"}];const DEFAULT='bigw',CFG_KEY='ac_audit_config',DB_KEY='ac_audit_db',GAS_DEFAULT='https://script.google.com/macros/s/AKfycbxOXfNmyfqZI6f9Uc__hxcmuiQt-QowkULw23GggAKM6nZ1mQ8DcOx5rwxa7d0obpIf/exec';let CUR='';
function cfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY)||'{}')}catch(e){return{}}}function gas(){return (cfg().gasUrl||GAS_DEFAULT).trim()}function db(){try{return JSON.parse(localStorage.getItem(DB_KEY)||'{}')}catch(e){return{}}}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}function state(c,m){document.getElementById('dot').className='dot '+c;document.getElementById('cmsg').textContent=m}
function renderTabs(){document.getElementById('tabs').innerHTML=TABS.map(x=>`<button class="tab ${x.id===CUR?'on':''}" onclick="show('${x.id}')">${x.icon||''} ${x.zh}</button>`).join('')}
function show(id){let t=TABS.find(x=>x.id===id)||TABS[0];CUR=t.id;renderTabs();document.getElementById('f').src=t.src;location.hash=t.id}
async function post(b){const r=await fetch(gas(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});return await r.json()}
function sig(k,r){if(!r)return'';if(r.id)return String(r.id);if(['documents','dcc_control','incoming_control'].includes(k))return [r.docNo,r.title,r.version].join('|');if(['audits','wse_assessment'].includes(k))return [r.auditType,r.auditName,r.date].join('|');return JSON.stringify(r).slice(0,180)}
function merge(a,b){a=a||{};b=b||{};const o=Object.assign({},b,a),del=Object.assign({},b.meta&&b.meta.deleted||{},a.meta&&a.meta.deleted||{});const ks=new Set([...Object.keys(a),...Object.keys(b)]);for(const k of ks){if(!Array.isArray(a[k])&&!Array.isArray(b[k]))continue;const m=new Map();for(const r of (b[k]||[]).concat(a[k]||[])){const s=sig(k,r);if(del[k+'|'+s])continue;const old=m.get(s);if(!old||Number(r._updated||0)>=Number(old._updated||0))m.set(s,r)}o[k]=[...m.values()]}o.meta=Object.assign({},b.meta||{},a.meta||{},{deleted:del});return o}
async function ping(){try{state('wait','連線中');const r=await fetch(gas()+'?action=ping');const j=await r.json();state(j.ok||j.pong?'ok':'bad',j.ok||j.pong?'Cloud 已連線':'Cloud Error')}catch(e){state('bad','Cloud 離線')}}
async function up(){try{let d=db();if(d.meta&&d.meta.lastSync&&Number(d.meta.updatedAt||0)<=Number(d.meta.lastSync||0)){toast('☁ 無新資料，不重複上傳');state('ok','已同步');return}state('wait','上傳中');const j=await post({action:'upload',data:d,updatedAt:d.meta&&d.meta.updatedAt||Date.now(),reason:'MODULE_SHELL'});if(!j.ok)throw Error(j.error||'upload failed');let m=merge(d,j.data||{});m.meta=m.meta||{};m.meta.lastSync=Date.now();localStorage.setItem(DB_KEY,JSON.stringify(m));state('ok','上傳完成');toast('☁↑ 上傳完成')}catch(e){state('bad','上傳失敗');toast('⚠ '+e.message)}}
async function down(){try{state('wait','下載中');const j=await post({action:'download'});if(!j.ok)throw Error(j.error||'download failed');let m=merge(db(),j.data||{});m.meta=m.meta||{};m.meta.lastSync=Date.now();localStorage.setItem(DB_KEY,JSON.stringify(m));state('ok','下載合併完成');toast('☁↓ 已合併，不重複資料')}catch(e){state('bad','下載失敗');toast('⚠ '+e.message)}}
async function sync(){try{const m=await post({action:'meta'}),d=db();if(Number(d.meta&&d.meta.updatedAt||0)>Number(m.updatedAt||0))return up();return down()}catch(e){toast('⚠ '+e.message)}}
const h=location.hash.slice(1);show(TABS.some(x=>x.id===h)?h:DEFAULT);ping();
</script></body></html>
