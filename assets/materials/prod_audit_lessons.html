<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>生產部門驗廠培訓教材 · VRT</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#1f2a24;--sub:#5d6b63;--acc:#2f7d5b;--line:#dfe7e2;--warn:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Noto Sans Khmer","Khmer OS",sans-serif;line-height:1.6}
header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:17px;flex:1}.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}.lang button{border:0;background:#fff;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}.lang button.on{background:var(--acc);color:#fff}
main{max-width:920px;margin:0 auto;padding:14px}
.intro{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:14px}
.toc a{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px}.toc a small{display:block;color:var(--sub);font-weight:400;font-size:12px}
.m{background:#fff;border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:14px;padding:12px 14px;margin:12px 0;scroll-margin-top:70px}
.m h2{margin:0 0 4px;font-size:18px}.why{color:var(--sub);font-size:14px;margin:0 0 8px}
.m h3{font-size:14px;margin:12px 0 4px;color:var(--acc)}
ol,ul{margin:0;padding-left:20px}li{margin:3px 0}
.ev{background:#f0fdf4;border:1px dashed #86efac;border-radius:10px;padding:8px 10px;font-size:13px}
.ng{background:#fffbeb;border:1px dashed #fcd34d;border-radius:10px;padding:8px 10px;font-size:13px}
.q{margin-top:10px;font-size:14px}.q details{border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:4px 0}.q summary{cursor:pointer;font-weight:600}
.src{font-size:11px;color:var(--sub);margin-top:8px}
@media print{header{position:static}.lang{display:none}.m{break-inside:avoid}}
</style></head><body>
<header><h1 id="ttl"></h1><div class="lang" id="lang"><button data-l="0">中</button><button data-l="1">EN</button><button data-l="2">ខ្មែរ</button></div></header>

 q:[[T('WSE 是社會責任驗廠嗎？','Is WSE a social audit?','WSE ជាសវនកម្មសង្គមឬ?'),T('不是，是技術品質與生產系統驗廠。','No – it is a technical quality and production-system audit.','មិនមែនទេ ជាសវនកម្មបច្ចេកទេស។')],[T('紀錄什麼時候填？','When do you fill a record?','ពេលណាត្រូវបំពេញកំណត់ត្រា?'),T('做完當下就填、簽名、寫日期。','Right after the job, signed and dated.','ភ្លាមៗ ក្រោយធ្វើរួច។')],[T('每款開產前要有哪三樣？','Which three things does every style need before bulk?','មុនផលិតត្រូវមានអ្វីខ្លះ?'),T('產前會議、試產、尺寸組報告。','PPM, pilot run and size-set report.','PPM ផលិតសាកល្បង របាយការណ៍ទំហំ។')]],

  T('生產區禁止可折斷式美工刀片','Snap-off blades are forbidden on the production floor','ហាមប្រើកាំបិតកាត់អាចបំបែកបាន'),

  T('針具紀錄保存 2 年','Keep needle records for 2 years','រក្សាកំណត់ត្រាម្ជុល ២ ឆ្នាំ')],

 ng:T('碎片沒貼齊卻已發新針；工位上有沒綁的剪刀；探測器測試紀錄有空格；探測區用柵欄隔、任何人都能進','New needle issued without all fragments; untied scissors at a station; gaps in detector tests; detector area fenced with mesh and open to anyone','បើកម្ជុលថ្មីដោយគ្មានបំណែកគ្រប់ កន្ត្រៃមិនចង'),
 q:[[T('斷針碎片少一段怎麼辦？','What if a fragment is missing?','បើបាត់បំណែកមួយ ធ្វើយ៉ាងម៉េច?'),T('那批衣服隔離，用探測器找到為止，主管簽名才放行。','Quarantine the bundle, search until found, release only after the supervisor signs.','ញែកចេញ ស្វែងរក ប្រធានចុះហត្ថលេខា។')],[T('金屬探測器多久測一次？','How often is the detector tested?','សាកម៉ាស៊ីនរកដែកញឹកប៉ុណ្ណា?'),T('開工時，之後每 2 小時。','At start-up, then every 2 hours.','ពេលចាប់ផ្តើម និងរៀងរាល់ ២ ម៉ោង។')],[T('可以用折斷式美工刀嗎？','Can you use a snap-off blade?','អាចប្រើកាំបិតបំបែកបានទេ?'),T('不行，生產區禁止。','No, it is forbidden in production.','មិនបានទេ។')]],

{id:'snap',ic:'🔘',t:T('金屬附件（四合扣、鈕扣）拉力與 SPC','Metal trims (snaps, buttons): pull test and SPC','ឡេវដែក និងប៊ូតុង៖ ការសាកល្បងទាញ'),

{id:'trace',ic:'🔎',t:T('追溯（2 小時）與不合格品隔離','Traceability (2 hours) and nonconforming product','ការតាមដាន (២ ម៉ោង) និងផលិតផលមិនស្តង់ដារ'),

  T('生產日報寫清楚哪條線做哪個 PO、幾件','Daily reports show which line made which PO and how many','របាយការណ៍ប្រចាំថ្ងៃបង្ហាញខ្សែណាធ្វើ PO ណា'),
  T('不合格品掛紅牌、放紅區，不能混回良品；處理方式要有人簽名','Nonconforming goods get a red tag and go to the red area; never mixed back; disposal is signed off','ផលិតផលខុសស្តង់ដារ ដាក់ស្លាកក្រហម នៅតំបន់ក្រហម'),
  T('客訴或異常要開異常報告、找原因、做改善，下次同款開工前先看','Complaints and problems get an anomaly report, root cause and action – checked before the same style runs again','បញ្ហាត្រូវមានរបាយការណ៍ ហើយមើលមុនផលិតម៉ូដដដែល')],

{id:'grs',ic:'♻️',t:T('GRS 回收認證訂單：生產線怎麼做','GRS recycled orders: what the line must do','ការបញ្ជាទិញ GRS៖ អ្វីដែលខ្សែផលិតត្រូវធ្វើ'),

 todo:[T('進料要有供應商的 TC（交易證書）號碼，和布卷標籤對得上','Incoming GRS fabric must match the supplier transaction certificate (TC) number on the roll labels','ក្រណាត់ GRS ត្រូវមានលេខ TC ត្រូវនឹងស្លាកមុខក្រណាត់'),
  T('GRS 布和一般布分開放、綠色標示，不可混用','Store GRS fabric separately with green labels; never mix with conventional fabric','ទុកក្រណាត់ GRS ដាច់ដោយឡែក ស្លាកពណ៌បៃតង'),
  T('裁剪、車縫、包裝都要寫 GRS 批號；剩布、裁片廢料要秤重記錄','Write the GRS lot at cutting, sewing and packing; weigh and record leftover fabric and cutting waste','សរសេរលេខឡូត GRS គ្រប់ដំណាក់កាល ថ្លឹងកាកសំណល់'),
  T('投入與產出（用布量、成品數、廢料）要能對平（質量平衡）','Input and output must balance (fabric used, garments made, waste) – mass balance','ការបញ្ចូល និងទិន្នផលត្រូវស្មើគ្នា'),
  T('只有經核准的 GRS 單才能掛 GRS 吊牌；化學品照核准清單用','Only approved GRS orders carry GRS labels; use chemicals from the approved list only','មានតែការបញ្ជាទិញ GRS ទើបដាក់ស្លាក GRS'),
  T('參與 GRS 的人每年要受訓並簽到','Everyone working on GRS is trained yearly with sign-in records','អ្នកធ្វើការ GRS ត្រូវបណ្តុះបណ្តាលរៀងរាល់ឆ្នាំ')],
