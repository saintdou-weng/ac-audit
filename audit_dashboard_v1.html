<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AC Audit 報告中心 · VRT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4;--surface:#fff;--surface-2:#F5F7F9;--sunk:#E7EBF0;
  --ink:#15202B;--ink-2:#465566;--muted:#768494;--line:#D9DFE6;--line-2:#E8ECF1;
  --accent:#0F6E63;--accent-2:#0B5249;--accent-soft:#DCEFEB;
  --good:#0ca30c;--good-ink:#0a6b0a;--good-soft:#E3F5E3;
  --warn:#fab219;--warn-ink:#8a5a00;--warn-soft:#FFF3D6;
  --serious:#ec835a;--crit:#d03b3b;--crit-ink:#a52a2a;--crit-soft:#FBE4E4;
  --info:#2a78d6;--info-soft:#E3EEFB;--plan:#b7d3f6;--gray:#B8C1CC;--gray-soft:#EEF1F4;
  --f:"IBM Plex Sans","Noto Sans TC","Noto Sans Khmer",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fd:"IBM Plex Sans Condensed","Noto Sans TC",sans-serif;
  --r:12px;--shadow:0 1px 2px rgba(20,32,43,.05),0 6px 20px rgba(20,32,43,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:112px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
/* top bar */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.home{text-decoration:none;color:var(--ink-2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-weight:600;font-size:13px;background:#fff}
.brand{font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:0}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 13px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:#fff}
.nav{display:inline-flex;align-items:center;gap:4px}
.ib{border:1px solid var(--line);background:#fff;border-radius:9px;min-width:34px;height:34px;padding:0 9px;font-size:13px;font-weight:600;color:var(--ink-2)}
.ib:hover{border-color:var(--accent);color:var(--accent)}
.ib.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.ib.pri:hover{background:var(--accent-2);color:#fff}
.ib:disabled{opacity:.5;cursor:default}
.plabel{font-weight:700;font-size:14px;min-width:150px;text-align:center}
.fresh{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gray)}
.dot.ok{background:var(--good)}.dot.wait{background:var(--warn);animation:pulse 1s infinite}.dot.bad{background:var(--crit)}
@keyframes pulse{50%{opacity:.35}}
.tabs{max-width:1180px;margin:0 auto;padding:6px 10px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:13px;padding:8px 12px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs a .c{font-weight:700;font-size:11px;background:var(--sunk);border-radius:99px;padding:1px 7px;margin-left:5px;color:var(--ink-2)}
.tabs a .c.r{background:var(--crit-soft);color:var(--crit-ink)}
/* layout */
main{max-width:1180px;margin:0 auto;padding:16px 16px 90px}
section{margin-bottom:22px}
.h{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px;flex-wrap:wrap}
.h h2{font-family:var(--fd);font-size:18px;margin:0;font-weight:700}
.h .sub{font-size:12px;color:var(--muted)}
.h .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1.25fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;border-left:6px solid var(--gray)}
.hero.red{border-left-color:var(--crit);background:linear-gradient(90deg,var(--crit-soft),#fff 38%)}
.hero.yellow{border-left-color:var(--warn);background:linear-gradient(90deg,var(--warn-soft),#fff 38%)}
.hero.green{border-left-color:var(--good);background:linear-gradient(90deg,var(--good-soft),#fff 38%)}
.hero.blue{border-left-color:var(--info);background:linear-gradient(90deg,var(--info-soft),#fff 38%)}
.lamp{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:#fff;border:1px solid var(--line)}
.hero h1{margin:0;font-size:21px;line-height:1.35;font-weight:700}
.hero .second{margin-top:4px;font-size:14px;color:var(--ink-2);font-weight:500}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--ink-2)}
.note{margin-bottom:8px;font-size:13px;font-weight:600;color:var(--ink)}
.note button{border:0;background:none;color:var(--muted);font-size:12px;margin-left:6px}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;text-decoration:none;color:inherit;display:block;position:relative;overflow:hidden;transition:transform .12s,box-shadow .12s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gray)}
.kpi.red::before{background:var(--crit)}.kpi.yellow::before{background:var(--warn)}.kpi.green::before{background:var(--good)}.kpi.blue::before{background:var(--info)}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;gap:5px;align-items:center}
.kpi .v{font-family:var(--fd);font-size:30px;font-weight:700;line-height:1.1;margin-top:4px}
.kpi .v small{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}
.kpi .d{font-size:11.5px;color:var(--ink-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* actions */
.acts{display:grid;gap:9px}
.act{display:grid;grid-template-columns:28px 1fr;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.act .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.act b{display:block;font-size:14px}
.act span{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.act span i{font-style:normal;font-weight:700;color:var(--accent)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap;border:1px solid transparent}
.pill.green{background:var(--good-soft);color:var(--good-ink)}.pill.yellow{background:var(--warn-soft);color:var(--warn-ink)}
.pill.red{background:var(--crit-soft);color:var(--crit-ink)}.pill.blue{background:var(--info-soft);color:#1c5cab}.pill.gray{background:var(--gray-soft);color:var(--ink-2);border-color:var(--line)}
/* rows */
.rows{display:grid}
.row{display:grid;gap:10px;align-items:center;padding:11px 6px;border-top:1px solid var(--line-2);cursor:pointer;border-radius:8px}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .t{font-weight:600;min-width:0}
.row .t small{display:block;font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cert-row{grid-template-columns:minmax(150px,1.4fr) 2fr 108px 110px}
.cap-row{grid-template-columns:88px minmax(0,2.2fr) 1.3fr 92px 104px}
.bar{height:10px;border-radius:5px;background:var(--sunk);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff}
.r{text-align:right}.muted{color:var(--muted)}.small{font-size:12px}
.chev{color:var(--muted);font-size:16px;text-align:right}
/* audit cards */
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.acard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;border-top:4px solid var(--gray)}
.acard.green{border-top-color:var(--good)}.acard.yellow{border-top-color:var(--warn)}.acard.red{border-top-color:var(--crit)}
.acard:hover{box-shadow:var(--shadow)}
.acard .s{font-family:var(--fd);font-weight:700;font-size:17px}
.acard .res{font-weight:700;font-size:13px;margin:4px 0 2px}
.acard .m{font-size:12px;color:var(--muted)}
svg text{font-family:var(--f)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
/* matrix */
.mx-wrap{overflow-x:auto}
table.mx{border-collapse:separate;border-spacing:2px;width:100%;min-width:720px;font-size:12px}
.mx th{font-weight:600;color:var(--muted);font-size:11px;padding:2px}
.mx th.cur{color:var(--accent);font-weight:700}
.mx td.n{text-align:left;padding:3px 8px 3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px;font-weight:500;cursor:pointer}
.mx td.n:hover{color:var(--accent)}
.mx td.c{width:6.2%;height:24px;border-radius:5px;text-align:center;font-weight:700;font-size:11px;background:var(--surface-2)}
.mx td.s1{background:var(--plan);color:#184f95}.mx td.s2{background:var(--good);color:#fff}.mx td.s3{background:var(--warn);color:#0b0b0b}.mx td.s4{background:var(--gray);color:#fff}
.mx td.late{box-shadow:inset 0 0 0 2px var(--crit)}
.mx td.cat{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:8px;text-align:left}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tb tr.click{cursor:pointer}.tb tr.click:hover td{background:var(--surface-2)}
.tb td.r,.tb th.r{text-align:right}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}
/* feed */
.feed{display:grid}
.fi{display:grid;grid-template-columns:86px 26px 1fr;gap:8px;padding:8px 4px;border-top:1px solid var(--line-2);font-size:13px}
.fi:first-child{border-top:0}
.fi .when{color:var(--muted);font-size:12px}
/* history */
.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.hc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;border-left:5px solid var(--gray)}
.hc.red{border-left-color:var(--crit)}.hc.yellow{border-left-color:var(--warn)}.hc.green{border-left-color:var(--good)}.hc.blue{border-left-color:var(--info)}
.hc:hover{box-shadow:var(--shadow)}
.hc b{display:block}.hc span{display:block;font-size:12px;color:var(--ink-2);margin-top:3px}
.hc em{font-style:normal;font-size:11px;color:var(--muted);display:block;margin-top:6px}
/* drawer */
.mask{position:fixed;inset:0;background:rgba(15,25,35,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:61;transform:translateX(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(15,25,35,.2)}
.drawer.on{transform:none}
.dh{background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
.dh h3{margin:0;font-size:17px;font-family:var(--fd);line-height:1.3}
.dh .x{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;font-size:18px;flex:0 0 auto}
.db{overflow-y:auto;padding:14px 16px 40px;display:grid;gap:12px;align-content:start}
.db .card{box-shadow:none;padding:13px}
.db h4{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
dl.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:0}
dl.kv dt{font-size:11px;color:var(--muted)}dl.kv dd{margin:1px 0 0;font-weight:600;word-break:break-word}
dl.kv .full{grid-column:1/-1}
.tl{position:relative;padding-left:18px;display:grid;gap:10px}
.tl::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl div{position:relative;font-size:13px}
.tl div::before{content:'';position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.tl b{display:block}.tl span{color:var(--ink-2)}.tl time{font-size:11px;color:var(--muted)}
.warnbox{background:var(--warn-soft);border:1px solid #f1d58f;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--warn-ink)}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.form label{font-size:11px;color:var(--muted);display:grid;gap:3px;font-weight:600}
.form input,.form select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;background:#fff;min-width:150px}
pre.tg{white-space:pre-wrap;word-break:break-word;font-family:var(--f);font-size:13px;line-height:1.55;margin:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:80;opacity:0;transition:all .25s;pointer-events:none;max-width:92%}
#toast.on{opacity:1;transform:translateX(-50%)}
#tip{position:fixed;z-index:90;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;pointer-events:none;opacity:0;transition:opacity .1s;max-width:260px;line-height:1.45}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.g2,.g3{grid-template-columns:1fr}.cert-row{grid-template-columns:1fr 96px 20px}.cert-row .bar,.cert-row .date{display:none}.cap-row{grid-template-columns:1fr 96px}.cap-row .cl,.cap-row .own,.cap-row .due{display:none}.plabel{min-width:0}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.lamp{display:none}.hero h1{font-size:18px}.brand small{display:none}.fi{grid-template-columns:54px 22px 1fr}main{padding:12px 10px 90px}.top-in{padding:8px 10px 0}}
@media print{.top,.ib,.mask,.drawer,#toast,.noprint{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card{box-shadow:none;break-inside:avoid}section{break-inside:avoid}}
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <a class="home" href="ac_audit_platform_v1.html">← AC Audit</a>
    <div class="brand">報告中心 <small>週報 · 月報 · 證書 · 稽核 · 缺失 · 培訓</small></div>
    <div class="sp"></div>
    <span class="fresh"><span class="dot" id="dot"></span><span id="fresh">讀取中…</span></span>
    <div class="seg" id="kindSeg"><button data-k="week">週報</button><button data-k="month">月報</button></div>
    <div class="nav"><button class="ib" onclick="shift(-1)" title="上一期">◀</button><span class="plabel num" id="plabel">—</span><button class="ib" onclick="shift(1)" id="nextBtn" title="下一期">▶</button><button class="ib" onclick="goNow()">本期</button></div>
    <button class="ib" onclick="refresh(true)" title="重新讀取">↻</button>
    <button class="ib" onclick="window.print()">🖨 列印</button>
    <button class="ib pri" onclick="sendReport()" id="sendBtn">✈ 發到群組</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>
<main id="main"><div class="card empty">讀取雲端資料中…</div></main>
<div class="mask" id="mask" onclick="closeD()"></div>
<aside class="drawer" id="drawer"><div class="dh"><div id="dtitle"></div><button class="x" onclick="closeD()">×</button></div><div class="db" id="dbody"></div></aside>
<div id="toast"></div><div id="tip"></div>
<script src="assets/ac_audit_engine.js?v=4"></script>
<script>
const GAS_DEFAULT='https://script.google.com/macros/s/AKfycbxOXfNmyfqZI6f9Uc__hxcmuiQt-QowkULw23GggAKM6nZ1mQ8DcOx5rwxa7d0obpIf/exec';
const CACHE='ac_audit_dash_cache_v1';
let DB={},TR={trainings:[],records:{}},HIST=[],F=null,KIND=localStorage.getItem('ac_audit_dash_kind')||'week',ANCHOR=null,LOADED=0,CAPF='open';
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pad=n=>String(n).padStart(2,'0');
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(s,n){const d=ACR.parse(s);d.setDate(d.getDate()+n);return ACR.ymd(d)}
function gas(){try{return (JSON.parse(localStorage.getItem('ac_audit_config')||'{}').gasUrl||GAS_DEFAULT).trim()}catch(e){return GAS_DEFAULT}}
async function post(b){const r=await fetch(gas(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});return r.json()}
function toast(s,ms){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),ms||2600)}
function who(){return localStorage.getItem('ac_audit_checker')||''}
const ICON={red:'🔴',yellow:'🟡',green:'🟢',blue:'🔵',gray:'⚪'};
const LT={red:'要處理',yellow:'注意',green:'正常',blue:'說明',gray:'待確認'};
function pill(light,txt){return `<span class="pill ${light}">${esc(txt)}</span>`}
function fmtDays(d){return d==null?'':d<0?'過 '+(-d)+' 天':d===0?'今天':'剩 '+d+' 天'}

/* ── 讀資料 ── */
function setFresh(st,txt){$('#dot').className='dot '+st;$('#fresh').textContent=txt}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE)||'null');if(c&&c.db){DB=c.db;TR=c.tr||TR;HIST=c.hist||[];LOADED=c.ts||0;return true}}catch(e){}return false}
async function refresh(manual){
  setFresh('wait','同步雲端…');
  try{
    const [a,b,h]=await Promise.all([post({action:'download'}),fetch(gas()+'?action=getAll').then(r=>r.json()),post({action:'reportHistory'}).catch(()=>({}))]);
    if(a&&a.ok){DB=a.data||{}}
    if(b&&b.trainings){TR={trainings:b.trainings||[],records:b.records||{},library:b.library||[]}}
    if(h&&h.ok)HIST=h.list||[];
    LOADED=Date.now();
    try{localStorage.setItem(CACHE,JSON.stringify({db:DB,tr:TR,hist:HIST,ts:LOADED}))}catch(e){}
    setFresh('ok','已更新 '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
    render(); if(manual)toast('✓ 已是雲端最新資料');
  }catch(e){setFresh('bad','離線，顯示上次資料');if(manual)toast('⚠ 連不上雲端：'+e.message)}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-LOADED>5*60000)refresh()});

/* ── 期間 ── */
function setKind(k){KIND=k;localStorage.setItem('ac_audit_dash_kind',k);ANCHOR=null;render()}
function curAnchor(){return ANCHOR||todayStr()}
function shift(n){const P=ACR.periodOf(KIND,curAnchor());ANCHOR=KIND==='week'?addDays(P.from,7*n):(()=>{const d=ACR.parse(P.from);d.setMonth(d.getMonth()+n);d.setDate(15);return ACR.ymd(d)})();render()}
function goNow(){ANCHOR=null;render()}
document.getElementById('kindSeg').addEventListener('click',e=>{const k=e.target.dataset.k;if(k)setKind(k)});

/* ── 圖 ── */
function tipOn(e,html){const t=$('#tip');t.innerHTML=html;t.style.opacity=1;const x=Math.min(window.innerWidth-270,e.clientX+12),y=e.clientY+14;t.style.left=Math.max(6,x)+'px';t.style.top=y+'px'}
function tipOff(){$('#tip').style.opacity=0}
document.addEventListener('mousemove',e=>{const el=e.target.closest('[data-tip]');if(el)tipOn(e,el.getAttribute('data-tip'));else tipOff()});
document.addEventListener('touchstart',e=>{const el=e.target.closest('[data-tip]');if(el){const t=e.touches[0];tipOn({clientX:t.clientX,clientY:t.clientY},el.getAttribute('data-tip'));setTimeout(tipOff,2200)}},{passive:true});

function trainChart(T){
  const W=720,H=230,L=34,B=30,TOP=18,bw=(W-L-8)/12,max=Math.max(4,...T.byMonth.map(m=>m.plan-m.cancel));
  const y=v=>TOP+(H-TOP-B)*(1-v/max);let g='';
  for(let v=0;v<=max;v+=Math.max(1,Math.ceil(max/4)))g+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="#E8ECF1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#768494">${v}</text>`;
  T.byMonth.forEach((m,i)=>{const x=L+i*bw,p=m.plan-m.cancel,w=bw*0.36,cur=m.m===T.thisMonth,fut=m.m>T.thisMonth;
    const tip=`${m.m} 月<br>計劃 ${p} 門｜完成 ${m.done}｜延後 ${m.post}｜未上 ${m.wait}<br>${m.sessions} 場・${m.attendees} 人次`;
    g+=`<g data-tip="${tip}"><rect x="${x}" y="${TOP}" width="${bw}" height="${H-TOP-B}" fill="${cur?'#F2F8F7':'transparent'}"/>`;
    g+=`<rect x="${x+bw*0.12}" y="${y(p)}" width="${w}" height="${Math.max(0,y(0)-y(p))}" rx="4" fill="#b7d3f6"/>`;
    g+=`<rect x="${x+bw*0.12+w+2}" y="${y(m.done)}" width="${w}" height="${Math.max(0,y(0)-y(m.done))}" rx="4" fill="${fut?'#D9DFE6':'#0ca30c'}"/>`;
    if(p&&!fut)g+=`<text x="${x+bw/2}" y="${Math.min(y(p),y(m.done))-5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${m.pct>=90?'#0a6b0a':m.pct>=60?'#8a5a00':'#a52a2a'}">${m.pct==null?'':m.pct+'%'}</text>`;
    g+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="11" font-weight="${cur?700:400}" fill="${cur?'#0F6E63':'#465566'}">${m.m}月</text></g>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="每月培訓計劃與完成門數">${g}<line x1="${L}" x2="${W-4}" y1="${y(0)}" y2="${y(0)}" stroke="#C3CBD5"/></svg>
  <div class="legend"><span><i class="sw" style="background:#b7d3f6"></i>計劃門數</span><span><i class="sw" style="background:#0ca30c"></i>完成門數</span><span class="muted">柱子上的 % ＝ 當月完成率</span></div>`;
}
function attendChart(T){
  const W=720,H=150,L=34,B=26,TOP=14,bw=(W-L-8)/12,max=Math.max(10,...T.byMonth.map(m=>m.attendees)),y=v=>TOP+(H-TOP-B)*(1-v/max);let g='';
  T.byMonth.forEach((m,i)=>{const x=L+i*bw;g+=`<g data-tip="${m.m} 月：${m.sessions} 場・${m.attendees} 人次・${Math.round(m.hours*10)/10} 小時"><rect x="${x+bw*0.2}" y="${y(m.attendees)}" width="${bw*0.6}" height="${Math.max(0,y(0)-y(m.attendees))}" rx="4" fill="#2a78d6"/>${m.attendees?`<text x="${x+bw/2}" y="${y(m.attendees)-4}" text-anchor="middle" font-size="10.5" fill="#465566" font-weight="600">${m.attendees}</text>`:''}<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#465566">${m.m}月</text></g>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="每月培訓人次">${g}<line x1="${L}" x2="${W-4}" y1="${y(0)}" y2="${y(0)}" stroke="#C3CBD5"/></svg>`;
}
function auditTimeline(list){
  const done=list.filter(a=>a.date).sort((a,b)=>a.date<b.date?-1:1);if(!done.length)return '<div class="empty">還沒有稽核記錄</div>';
  const stds=[...new Set(done.map(a=>a.standard||'Other'))],W=720,L=118,rowH=34,H=stds.length*rowH+34;
  const t0=ACR.parse(done[0].date.slice(0,4)+'-01-01').getTime(),end=new Date();end.setMonth(end.getMonth()+2);const t1=end.getTime(),x=d=>L+(W-L-14)*((ACR.parse(d).getTime()-t0)/(t1-t0));
  let g='';for(let yy=+done[0].date.slice(0,4);yy<=end.getFullYear();yy++){const xx=x(yy+'-01-01');g+=`<line x1="${xx}" x2="${xx}" y1="6" y2="${H-22}" stroke="#E8ECF1"/><text x="${xx+4}" y="${H-6}" font-size="11" fill="#768494">${yy}</text>`}
  const tx=x(todayStr());g+=`<line x1="${tx}" x2="${tx}" y1="6" y2="${H-22}" stroke="#0F6E63" stroke-dasharray="3 3"/><text x="${tx}" y="${H-6}" font-size="10.5" fill="#0F6E63" text-anchor="middle" font-weight="700">今天</text>`;
  stds.forEach((s,i)=>{const yy=18+i*rowH;g+=`<text x="${L-10}" y="${yy+4}" text-anchor="end" font-size="12" font-weight="600" fill="#15202B">${esc(s)}</text><line x1="${L}" x2="${W-14}" y1="${yy}" y2="${yy}" stroke="#E8ECF1"/>`;
    done.filter(a=>(a.standard||'Other')===s).forEach(a=>{const c={green:'#0ca30c',yellow:'#fab219',red:'#d03b3b',gray:'#B8C1CC'}[a.light];g+=`<circle cx="${x(a.date)}" cy="${yy}" r="8" fill="${c}" stroke="#fff" stroke-width="2" style="cursor:pointer" data-tip="${esc(a.date)}　${esc(a.title)}<br>${esc(a.result||'')}${a.ncCount!=null?'・缺失 '+a.ncCount:''}" onclick="openAudit('${esc(a.id)}')"/>`})});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="稽核時間軸">${g}</svg><div class="legend"><span><i class="sw" style="background:#0ca30c;border-radius:50%"></i>通過／綠燈</span><span><i class="sw" style="background:#fab219;border-radius:50%"></i>需改善／Amber</span><span><i class="sw" style="background:#d03b3b;border-radius:50%"></i>未通過</span><span><i class="sw" style="background:#B8C1CC;border-radius:50%"></i>結果待補</span><span class="muted">點圓點看內容</span></div>`;
}

/* ── 畫面 ── */
function allAudits(){const out=[];const add=(r,key)=>{if(!r)return;const std=r.auditType||r.assessmentType||(key==='wse_assessment'?'WSE':'');const o={id:r.id,key,standard:std,title:r.title||r.auditName||std,date:String(r.date||'').slice(0,10),result:r.result||'',ncCount:r.ncCount==null?null:+r.ncCount,raw:r};const s=(o.result+'').toLowerCase();o.light=/red|fail|不合格|未通過/.test(s)?'red':/amber|improvement|需改善|minor|項缺失/.test(s)?'yellow':/green|pass|gold|通過|核發|certified/.test(s)?'green':'gray';if(r.verify&&o.light==='green'&&!/gold|green|通過（/i.test(s))o.light='gray';out.push(o)};
  (DB.audits||[]).forEach(r=>add(r,'audits'));(DB.wse_assessment||[]).forEach(r=>add(r,'wse_assessment'));(DB.assessments||[]).forEach(r=>add(r,'assessments'));return out}
function render(){
  F=ACR.build(DB,TR,{period:KIND,anchor:curAnchor(),today:todayStr()});const P=F.period,T=F.training;

  const mo=T.mo||{plan:0,done:0,cancel:0,wait:0,post:0,pct:null};
  const lastA=F.audits.last[0];
  const k=(href,light,l,v,unit,d)=>`<a class="kpi ${light}" href="#${href}"><div class="l">${l}</div><div class="v num">${v}<small>${unit||''}</small></div><div class="d">${d}</div></a>`;
  const certLight=F.certs.expired?'red':(F.certs.soon||F.certs.verify+F.certs.nodate)?'yellow':F.certs.total?'green':'gray';
  let h=`<section id="s-sum">
    <div class="card hero ${F.light}"><div class="lamp">${ICON[F.light]}</div><div>
      ${(F.notes||[]).map(n=>`<div class="note">📌 ${esc(n)}</div>`).join('')}
      <h1>${esc(F.headline)}</h1>${F.second?`<div class="second">${esc(F.second)}</div>`:''}
      <div class="tags">${(F.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<button class="tag noprint" style="cursor:pointer;border-style:dashed" onclick="addNote()">＋ 加一句備註到這期報告</button></div>
    </div></div>
    <div class="kpis">
      ${k('s-cert',certLight,'🏅 驗廠證書',F.certs.valid+F.certs.soon,'/'+F.certs.total,F.certs.expired?'過期 '+F.certs.expired+' 張':(F.certs.verify+F.certs.nodate)?'到期日待確認 '+(F.certs.verify+F.certs.nodate)+' 張':F.certs.soon?'90 天內到期 '+F.certs.soon+' 張':'全部有效')}
      ${k('s-audit',lastA?lastA.light:'gray','📋 最近稽核',lastA?esc(lastA.standard):'—','',lastA?esc(lastA.date+' '+(lastA.result||'')):'還沒有記錄')}
      ${k('s-cap',F.caps.overdue?'red':F.caps.open?'yellow':'green','🛠 未結缺失',F.caps.open,'項',F.caps.overdue?'過期 '+F.caps.overdue+' 項'+(F.caps.repeat?'・重複 '+F.caps.repeat:''):F.caps.total?'已結 '+F.caps.closed+' 項':'沒有缺失記錄')}
      ${k('s-train',mo.pct==null?'gray':mo.pct>=90?'green':(isCur||mo.pct>=60)?'yellow':'red','🎓 '+T.month+' 月培訓',mo.pct==null?'—':mo.pct,mo.pct==null?'':'%','計劃 '+(mo.plan-mo.cancel)+' 門・完成 '+mo.done+'・未上 '+mo.wait)}
      ${k('s-train',T.ytd.pct==null?'gray':T.ytd.pct>=90?'green':T.ytd.pct>=70?'yellow':'red','📈 年度培訓累計',T.ytd.pct==null?'—':T.ytd.pct,'%','應上 '+(T.ytd.plan-T.ytd.cancel)+' 門次・已上 '+T.ytd.done)}
      ${k('s-train',T.period.sessions?'blue':'gray','📝 '+(KIND==='week'?'本週':'本月')+'場次',T.period.sessions,'場',T.period.attendees+' 人次・'+T.period.hours+' 小時')}
    </div>
  </section>`;
  if(F.actions.length)h+=`<section><div class="h"><h2>⚠️ 要處理</h2><span class="sub">最多列 4 件，照嚴重度排</span></div><div class="acts">${F.actions.map((a,i)=>`<div class="act"><div class="n">${i+1}</div><div><b>${esc(a.issue)}</b><span>→ <i>${esc(a.who)}</i>：${esc(a.what)}</span></div></div>`).join('')}</div></section>`;
  /* 證書 */
  const maxD=365;
  h+=`<section id="s-cert"><div class="h"><h2>🏅 驗廠證書</h2><span class="sub">有效 ${F.certs.valid}・90 天內到期 ${F.certs.soon}・過期 ${F.certs.expired}・待確認 ${F.certs.verify+F.certs.nodate}</span><span class="sp"></span><button class="ib noprint" onclick="newCert()">＋ 新增</button></div>
  <a class="noprint" href="https://saintdou-weng.github.io/ac-hra-portal/ac_hra_certificate_visa_v1.html" target="_blank" rel="noopener" style="display:block;margin:0 0 10px;padding:10px 14px;border:1px dashed #b9c9c6;border-radius:12px;color:#0F6E63;text-decoration:none;font-size:14px;background:#f4faf9">🛂 政府證照／許可（消防、營運、環保檢測、簽證…）在 <b>HRA 平台・證書類別</b> 管理，這裡只放驗廠證書　→ 打開</a>

  /* 稽核 */
  const AA=allAudits();
  h+=`<section id="s-audit"><div class="h"><h2>📋 稽核結果</h2><span class="sub">各標準最近一次 ＋ 2024 年至今的時間軸</span></div>
  <div class="acards">${F.audits.last.map(a=>`<div class="acard ${a.light}" onclick="openAudit('${esc(a.id)}')"><div class="s">${esc(a.standard)}</div><div class="res">${ICON[a.light]} ${esc(a.result||'結果待補')}</div><div class="m num">${esc(a.date)}${a.ncCount!=null?'・缺失 '+a.ncCount+' 項':''}</div><div class="m">${esc(a.firm||'')}</div></div>`).join('')||'<div class="card empty">還沒有稽核記錄</div>'}</div>

  /* 缺失 */

  h+=`<section id="s-train"><div class="h"><h2>🎓 培訓</h2><span class="sub">${T.year} 年・${T.courses} 門課・記錄到 ${esc(T.lastRecord||'—')}</span><span class="sp"></span><a class="ib noprint" style="text-decoration:none;display:inline-grid;place-items:center" href="vrt_training_v1.html">開培訓管理 →</a></div>

  `<div class="card"><h4>課程</h4><dl class="kv">${kv('類別',esc(t.category||''))}${kv('頻率',esc(t.frequency||''))}${kv('講師',esc(t.trainer||''))}${kv('時數',esc(t.hours||''))}${kv('對象',esc(t.traineeZH||t.traineeEN||''),1)}${kv('備註',esc(t.remarks||''),1)}</dl></div>
   <div class="card"><h4>${F.training.year} 年計劃</h4><table class="mx" style="min-width:0"><thead><tr>${Array.from({length:12},(_,i)=>`<th>${i+1}</th>`).join('')}</tr></thead><tbody><tr>${Array.from({length:12},(_,i)=>{const c=+(t.months[i+1]||t.months[String(i+1)]||0);return `<td class="c s${c}">${['','計','✓','延','✕'][c]}</td>`}).join('')}</tr></tbody></table></div>
   <div class="card"><h4>上課記錄（${recs.length} 場・${tot} 人次）</h4>${recs.length?`<table class="tb"><thead><tr><th>日期</th><th>講師</th><th>對象</th><th class="r">人數</th></tr></thead><tbody>${recs.map(r=>`<tr><td class="num" style="white-space:nowrap">${esc(r.date)}<br><span class="small muted">${esc(r.time||'')}</span></td><td>${esc(r.trainer||'')}</td><td>${esc(r.participant||'')}</td><td class="r num"><b>${+r.attendees||0}</b></td></tr>`).join('')}</tbody></table>`:'<div class="muted small">今年還沒有這門課的上課記錄</div>'}</div>`)}
async function openHist(id){openD('<h3>🗂 歷史報告</h3>','<div class="card empty">讀取中…</div>');try{const r=await post({action:'reportGet',id});if(!r.ok)throw Error(r.error);const x=r.report,f=x.facts||{},now=F;
  const cmp=(l,a,b)=>`<tr><td>${l}</td><td class="r num"><b>${a}</b></td><td class="r num">${b}</td><td class="r num">${typeof a==='number'&&typeof b==='number'&&a!==b?(b>a?'<span style="color:var(--crit-ink)">▲':'<span style="color:var(--good-ink)">▼')+Math.abs(b-a)+'</span>':'—'}</td></tr>`;
  openD(`<h3>${x.kind==='month'?'月報':'週報'}｜${esc(x.label)}</h3><div class="small muted">${esc(x.sentAt)} 發出・${x.auto?'自動':'手動'}${x.by?'・'+esc(x.by):''}${x.rev>1?'・第 '+x.rev+' 版':''}</div>`,
  `<div class="card"><h4>當時發到群組的內容</h4><pre class="tg">${x.text.replace(/<(?!\/?(b|code)>)[^>]*>/g,'')}</pre></div>
   ${f.caps?`<div class="card"><h4>當時 vs 現在</h4><table class="tb"><thead><tr><th>項目</th><th class="r">當時</th><th class="r">現在</th><th class="r">變化</th></tr></thead><tbody>${cmp('未結缺失',f.caps.open,now.caps.open)}${cmp('過期缺失',f.caps.overdue,now.caps.overdue)}${cmp('證書待確認',(f.certs.verify||0)+(f.certs.nodate||0),now.certs.verify+now.certs.nodate)}${cmp('年度培訓已上（門次）',f.training.ytd.done,now.training.ytd.done)}${cmp('年度培訓人次',f.training.ytd.attendees,now.training.ytd.attendees)}</tbody></table></div>`:''}`)}catch(e){$('#dbody').innerHTML=`<div class="card empty">⚠ ${esc(e.message)}</div>`}}
function addNote(){openD('<h3>📌 加一句備註</h3>',`<div class="card"><div class="small muted" style="margin-bottom:8px">這句話會放在這期報告最上面（網頁和 Telegram 都會帶），例如突發狀況、客人來廠、稽核改期。</div><div class="form"><label>備註<input id="n_text" style="min-width:300px" maxlength="120" placeholder="例：11/20 BIG W 追蹤稽核，等客人通知確定日期"></label>${nameAsk()}<button class="ib pri" onclick="saveNote()">💾 加入</button></div></div>`)}
async function saveNote(){const t=$('#n_text').value.trim();if(!t)return toast('請輸入內容');try{const r=await post({action:'note',text:t,period:F.period.key,by:saveBy()||'web'});if(!r.ok)throw Error(r.error);toast('✓ 已加入');closeD();refresh()}catch(e){toast('⚠ '+e.message)}}
async function sendReport(){const P=F.period;openD('<h3>✈ 發到 Telegram 群組</h3>',`<div class="card"><h4>預覽（${esc(P.label)}）</h4><pre class="tg">${ACR.toTelegram(F).replace(/<(?!\/?(b|code)>)[^>]*>/g,'')}</pre></div><div class="card"><div class="form">${nameAsk()}<button class="ib pri" id="goSend" onclick="doSend()">✈ 確定發出</button><button class="ib" onclick="closeD()">取消</button></div><div class="small muted" style="margin-top:8px">發出後會留在「歷史報告」。同一期重發會標第 2 版。</div></div>`)}
async function doSend(){const b=$('#goSend');b.disabled=true;b.textContent='發送中…';try{const r=await post({action:'reportSend',kind:KIND,anchor:F.period.from,by:saveBy()||'web'});if(!r.ok)throw Error(r.error||'failed');toast('✓ 已發到群組');closeD();refresh()}catch(e){toast('⚠ '+e.message);b.disabled=false;b.textContent='✈ 確定發出'}}

if(loadCache()){render();setFresh('wait','同步雲端…')}
refresh();
</script>
</body>
</html>
