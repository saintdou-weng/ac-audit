*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,"Noto Sans TC","Noto Sans Khmer",sans-serif;background:var(--bg);color:var(--ink)}.app{height:100%;display:flex;flex-direction:column}.head{background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:9px;min-height:60px;flex-wrap:wrap}.home{text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-weight:800;background:#fff}.brand{display:flex;align-items:center;gap:8px;min-width:210px}.ico{font-size:25px}.ttl{font-size:15px;font-weight:900}.sub{font-size:10px;color:var(--muted);margin-top:2px}.tools{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:#f8f8f6;border-radius:999px;padding:6px 9px;font-size:10px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:#aaa}.dot.ok{background:#44bd83}.dot.wait{background:#f0b53c}.dot.bad{background:#e05c65}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 9px;font-weight:800;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;justify-content:center}.btn:hover{background:#f4f0e8}.btn.pri{background:var(--green);border-color:var(--green);color:#fff}.btn.dng{color:#fff;background:var(--red);border-color:var(--red)}.tabs{display:flex;gap:0;background:#fff;border-bottom:1px solid var(--line);overflow:auto;padding:0 8px;flex-shrink:0}.tab{border:0;border-bottom:3px solid transparent;background:#fff;padding:11px 14px;font-weight:800;white-space:nowrap;color:#59606d;cursor:pointer}.tab.on{color:var(--ink);border-bottom-color:var(--gold)}.ops{background:#fff;border-bottom:1px solid var(--line);padding:8px 10px;display:none;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);z-index:5}.ops.on{display:flex}.ops .mini{font-size:11px;color:#667085;background:#faf9f6;border:1px solid var(--line);border-radius:999px;padding:6px 9px}.period{display:flex;gap:4px;overflow:auto}.period button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;font-weight:800}.period button.on{background:var(--blue);color:#fff;border-color:var(--blue)}.frame{flex:1;min-height:0;border:0;width:100%;background:#fff}#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 14px;background:#17243c;color:#fff;border-radius:8px;font-size:11px;opacity:0;pointer-events:none;transition:.2s;z-index:99999;max-width:90vw}#toast.on{opacity:1}.mask{display:none;position:fixed;inset:0;background:rgba(17,18,20,.55);z-index:9999;align-items:flex-start;justify-content:center;padding:4vh 10px;overflow:auto}.mask.on{display:flex}.modal{width:min(760px,100%);background:#fff;border-radius:12px;border-top:4px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.2)}.mh{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--line)}.mh h3{font-size:15px;margin:0}.mh .x{margin-left:auto;background:none;border:0;font-size:20px;cursor:pointer}.mb{padding:14px;max-height:72vh;overflow:auto}.mf{padding:12px 14px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:4px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit}textarea{min-height:90px}.tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:650px}.tbl th{background:#2c2f36;color:#fff;padding:8px;text-align:left;white-space:nowrap}.tbl td{border-bottom:1px solid #eee;padding:8px;vertical-align:top}.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.badge{border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;background:#eee;white-space:nowrap}.b-done{background:#e7f6ec;color:#187247}.b-pending{background:#fff0dc;color:#a15b00}.b-open{background:#e8f0ff;color:#2456a6}.b-closed{background:#eee;color:#666}.filebar{display:flex;gap:6px;flex-wrap:wrap}.filepill{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;background:#faf9f6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}.stat{border:1px solid var(--line);border-radius:10px;padding:9px;background:#faf9f6}.stat b{font-size:20px}.stat span{display:block;font-size:10px;color:var(--muted)}
@media(max-width:650px){.head{padding:7px 8px}.brand{min-width:0;flex:1}.tools{width:100%;margin-left:0}.tools .btn{flex:1}.chip{margin-left:auto}.sub{display:none}.tab{padding:10px 11px;font-size:12px}.ops{position:sticky;top:0}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><div class="head"><a class="home" href="ac_audit_platform_v1.html">← AC Audit</a><div class="brand"><div class="ico">⚖️</div><div><div class="ttl" id="title">柬埔寨法律</div><div class="sub">Cambodia Legal Reference · VRT</div></div></div><div class="tools"><div class="chip"><span class="dot" id="dot"></span><span id="cmsg">Cloud</span></div><button class="btn" onclick="up()">☁↑</button><button class="btn" onclick="down()">☁↓</button><button class="btn" onclick="sync()">⟳</button><button class="btn pri" onclick="toggleOps()">線上操作</button></div></div><div class="tabs" id="tabs"></div><div class="ops" id="ops"><div class="mini" id="opsCount">0 records</div><div class="period" id="periodBtns"></div><button class="btn pri" onclick="openRec()">＋新增</button><button class="btn" onclick="saveLocal()">💾儲存</button><button class="btn" onclick="pickImport()">⬆匯入</button><button class="btn" onclick="exportCsv()">⬇匯出CSV</button><button class="btn" onclick="exportJson()">🗂JSON</button><button class="btn" onclick="sendSummary()">📤發摘要</button><button class="btn" onclick="sendApproval()">✅送核可</button></div><iframe class="frame" id="f" title="柬埔寨法律"></iframe></div><div id="toast"></div><div class="mask" id="mask"><div class="modal" id="modal"></div></div><input id="imp" type="file" accept=".csv,.json" hidden><input id="att" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,application/pdf,application/msword,application/vnd.ms-excel,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.presentationml.presentation" multiple hidden>
<script>
const TABS=[{"id": "law", "zh": "法律參考", "en": "Law Reference", "km": "ច្បាប់", "icon": "⚖️", "src": "cambodia_law_v1.html"}];const DEFAULT='law',MODULE_KEY='cambodia_law',CFG_KEY='ac_audit_config',DB_KEY='ac_audit_db',GAS_DEFAULT='https://script.google.com/macros/s/AKfycbxOXfNmyfqZI6f9Uc__hxcmuiQt-QowkULw23GggAKM6nZ1mQ8DcOx5rwxa7d0obpIf/exec';let CUR='',PERIOD=localStorage.getItem('audit_shell_period_'+MODULE_KEY)||'month',EDIT_ID='',EDIT_FILES=[];
function cfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY)||'{}')}catch(e){return{}}}function gas(){return (cfg().gasUrl||GAS_DEFAULT).trim()}function db(){try{return JSON.parse(localStorage.getItem(DB_KEY)||'{}')}catch(e){return{meta:{updatedAt:0,lastSync:0,deleted:{}}}}}
function setdb(d){localStorage.setItem(DB_KEY,JSON.stringify(d));renderOpsStats()}function rows(){const d=db();return Array.isArray(d[MODULE_KEY])?d[MODULE_KEY]:[]}function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function nowdt(){return new Date().toLocaleString()}function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2500)}function state(c,m){document.getElementById('dot').className='dot '+c;document.getElementById('cmsg').textContent=m}
function tabLabel(x){return (x.icon||'')+' '+(x.zh||x.en||x.id)}function renderTabs(){document.getElementById('tabs').innerHTML=TABS.map(x=>`<button class="tab ${x.id===CUR?'on':''}" onclick="show('${x.id}')">${tabLabel(x)}</button>`).join('')}function show(id){let t=TABS.find(x=>x.id===id)||TABS[0];CUR=t.id;renderTabs();document.getElementById('f').src=t.src;location.hash=t.id}
function sig(k,r){if(!r)return'';if(['dcc_control','documents'].includes(k)&&r.docNo)return ['DCC',r.docNo,r.title||'',r.version||''].join('|');if(['wse_assessment','audits'].includes(k)&&r.title)return [k,r.date||'',r.title||'',r.checker||''].join('|');if(k==='cambodia_law'&&r.title)return [k,r.category||'',r.title||'',r.refNo||''].join('|');if(r.id)return String(r.id);return JSON.stringify(r).slice(0,180)}
function merge(a,b){a=a||{};b=b||{};const o=Object.assign({},b,a),del=Object.assign({},b.meta&&b.meta.deleted||{},a.meta&&a.meta.deleted||{}),ks=new Set([...Object.keys(a),...Object.keys(b)]);for(const k of ks){if(!Array.isArray(a[k])&&!Array.isArray(b[k]))continue;const m=new Map();for(const r of (b[k]||[]).concat(a[k]||[])){const s=sig(k,r);if(del[k+'|'+s])continue;const old=m.get(s);if(!old||Number(r._updated||0)>=Number(old._updated||0))m.set(s,r)}o[k]=[...m.values()]}o.meta=Object.assign({},b.meta||{},a.meta||{},{deleted:del});return o}
async function post(b){const r=await fetch(gas(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});return await r.json()}async function ping(){try{state('wait','連線中');const r=await fetch(gas()+'?action=ping');const j=await r.json();state(j.ok||j.pong?'ok':'bad',j.ok||j.pong?'Cloud 已連線':'Cloud Error')}catch(e){state('bad','Cloud 離線')}}
function saveLocal(){const d=db();d.meta=d.meta||{};d.meta.updatedAt=Date.now();setdb(d);state('wait','Cloud*');toast('已儲存本機，待上傳')}async function up(force){try{let d=db();d.meta=d.meta||{};if(!force&&d.meta.lastSync&&Number(d.meta.updatedAt||0)<=Number(d.meta.lastSync||0)){toast('☁ 無新資料，不重複上傳');state('ok','已同步');return}state('wait','上傳中');const j=await post({action:'upload',data:d,updatedAt:d.meta.updatedAt||Date.now(),reason:'SHELL_'+MODULE_KEY});if(!j.ok)throw Error(j.error||'upload failed');let m=merge(d,j.data||{});m.meta=m.meta||{};m.meta.lastSync=Date.now();setdb(m);state('ok','上傳完成');toast('☁↑ 上傳完成')}catch(e){state('bad','上傳失敗');toast('⚠ '+e.message)}}
async function down(){try{state('wait','下載中');const j=await post({action:'download'});if(!j.ok)throw Error(j.error||'download failed');let m=merge(db(),j.data||{});m.meta=m.meta||{};m.meta.lastSync=Date.now();setdb(m);state('ok','下載合併完成');toast('☁↓ 合併完成，不重複資料')}catch(e){state('bad','下載失敗');toast('⚠ '+e.message)}}async function sync(){try{const m=await post({action:'meta'}),d=db();if(Number(d.meta&&d.meta.updatedAt||0)>Number(m.updatedAt||0))return up();return down()}catch(e){toast('⚠ '+e.message)}}
function toggleOps(){document.getElementById('ops').classList.toggle('on');renderOpsStats()}function periodStart(){const n=new Date();if(PERIOD==='day')return new Date(n.getFullYear(),n.getMonth(),n.getDate());if(PERIOD==='week'){const d=(n.getDay()+6)%7;return new Date(n.getFullYear(),n.getMonth(),n.getDate()-d)}if(PERIOD==='year')return new Date(n.getFullYear(),0,1);if(PERIOD==='all')return new Date(2000,0,1);return new Date(n.getFullYear(),n.getMonth(),1)}function inPeriod(r){const d=new Date((r.date||r.dueDate||r.expiryDate||r.effectiveDate||today())+'T00:00:00');return d>=periodStart()}
function periodRows(){return rows().filter(inPeriod)}function renderPeriodBtns(){const labs={all:'全部',day:'日',week:'週',month:'月',year:'年'};document.getElementById('periodBtns').innerHTML=Object.keys(labs).map(k=>`<button class="${PERIOD===k?'on':''}" onclick="PERIOD='${k}';localStorage.setItem('audit_shell_period_'+MODULE_KEY,PERIOD);renderOpsStats()">${labs[k]}</button>`).join('')}function renderOpsStats(){renderPeriodBtns();const r=periodRows(),done=r.filter(x=>['done','completed','closed','valid','active'].includes(String(x.status||'').toLowerCase())).length,pending=r.filter(x=>['pending','planned','open','inprogress'].includes(String(x.status||'').toLowerCase())).length;document.getElementById('opsCount').textContent=`${PERIOD.toUpperCase()} · ${r.length} 筆 · 完成 ${done} · 未完成/待處理 ${pending}`;}
function openRec(id){const r=id?rows().find(x=>x.id===id):null;EDIT_ID=id||'';EDIT_FILES=(r&&r.photos?r.photos.slice():[]);document.getElementById('modal').innerHTML=`<div class="mh"><h3>⚖️ ${r?'編輯':'新增'} · 柬埔寨法律</h3><button class="x" onclick="closeM()">×</button></div><div class="mb"><div class="stats"><div class="stat"><b>${periodRows().length}</b><span>本期筆數</span></div><div class="stat"><b>Paul</b><span>核可人</span></div><div class="stat"><b>${EDIT_FILES.length}</b><span>附件</span></div><div class="stat"><b>${PERIOD}</b><span>期間</span></div></div><div class="grid"><div><label>日期</label><input id="r_date" type="date" value="${esc(r&&r.date||today())}"></div><div><label>狀態</label><select id="r_status"><option value="open">Open</option><option value="pending">Pending</option><option value="done">Done</option><option value="closed">Closed</option></select></div><div class="full"><label>標題 / 項目</label><input id="r_title" value="${esc(r&&r.title||r&&r.auditName||'')}" placeholder="WSE / WRAP / Law / DCC item"></div><div><label>Check 人</label><input id="r_checker" value="${esc(r&&r.checker||localStorage.getItem('ac_audit_checker')||'')}"></div><div><label>負責人 / 部門</label><input id="r_owner" value="${esc(r&&r.owner||r&&r.department||'')}"></div><div class="full"><label>備註 / 異常 / 改善</label><textarea id="r_notes">${esc(r&&r.notes||r&&r.description||'')}</textarea></div><div class="full"><label>照片 / PDF / Word / Excel / PPT 證據</label><div class="filebar" id="filebar"></div><button class="btn" onclick="pickAtt()">📎 上傳 / 拍照</button></div></div><div id="recList" style="margin-top:12px"></div></div><div class="mf"><button class="btn" onclick="closeM()">取消</button><button class="btn dng" onclick="delCurrent()">刪除</button><button class="btn pri" onclick="saveRec()">💾 儲存</button></div>`;document.getElementById('mask').classList.add('on');document.getElementById('r_status').value=(r&&r.status)||'open';drawFiles();drawRecList()}
function closeM(){document.getElementById('mask').classList.remove('on')}document.getElementById('mask').onclick=e=>{if(e.target.id==='mask')closeM()};
function drawFiles(){const bar=document.getElementById('filebar');if(!bar)return;bar.innerHTML=(EDIT_FILES||[]).map((f,i)=>`<span class="filepill">☁ ${esc(f.name||f.fileName||'file')} <button onclick="EDIT_FILES.splice(${i},1);drawFiles()">×</button></span>`).join('')||'<span class="filepill">尚無附件</span>'}
function readFile(f){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f)})}function fileSig(f){return [f.name,f.size,f.lastModified||0].join('|')}async function uploadAtt(f){const sig=fileSig(f);if(EDIT_FILES.some(x=>x.signature===sig)){toast('相同附件已存在，不重複上傳');return null}const dataUrl=await readFile(f);const j=await post({action:'uploadAttachment',module:MODULE_KEY,name:f.name,originalName:f.name,mime:f.type||'application/octet-stream',size:f.size,lastModified:f.lastModified||0,signature:sig,dataUrl});if(!j.ok)throw Error(j.msg||j.error||'Drive upload failed');return j.file}
function pickAtt(){const inp=document.getElementById('att');inp.onchange=async e=>{const fs=[...e.target.files];e.target.value='';try{toast('上傳 Google Drive…');for(const f of fs){const info=await uploadAtt(f);if(info)EDIT_FILES.push(info)}drawFiles();toast('附件已上傳 Drive')}catch(err){toast('⚠ '+err.message)}};inp.click()}
function saveRec(){const d=db();d[MODULE_KEY]=Array.isArray(d[MODULE_KEY])?d[MODULE_KEY]:[];let r=EDIT_ID?d[MODULE_KEY].find(x=>x.id===EDIT_ID):null;const isNew=!r;if(!r)r={id:'CAMBODIA_LAW-'+Date.now(),_created:Date.now()};r.date=document.getElementById('r_date').value;r.status=document.getElementById('r_status').value;r.title=document.getElementById('r_title').value.trim();r.auditName=r.title;r.checker=document.getElementById('r_checker').value.trim();r.owner=document.getElementById('r_owner').value.trim();r.notes=document.getElementById('r_notes').value.trim();r.description=r.notes;r.photos=EDIT_FILES.slice();r._updated=Date.now();delete r._summarySentAt;delete r._approvalSentAt;if(!r.title)return toast('請填寫標題');const ex=d[MODULE_KEY].findIndex(x=>sig(MODULE_KEY,x)===sig(MODULE_KEY,r)||x.id===r.id);if(ex>=0)d[MODULE_KEY][ex]=Object.assign(d[MODULE_KEY][ex],r);else d[MODULE_KEY].push(r);d.meta=d.meta||{};d.meta.updatedAt=Date.now();setdb(d);localStorage.setItem('ac_audit_checker',r.checker||'');state('wait','Cloud*');toast((isNew?'新增':'修改')+'已儲存');drawRecList()}
function delCurrent(){if(!EDIT_ID)return closeM();const d=db(),arr=d[MODULE_KEY]||[],r=arr.find(x=>x.id===EDIT_ID);if(!r)return closeM();if(!confirm('刪除此筆資料？'))return;d.meta=d.meta||{};d.meta.deleted=d.meta.deleted||{};d.meta.deleted[MODULE_KEY+'|'+sig(MODULE_KEY,r)]=Date.now();d[MODULE_KEY]=arr.filter(x=>x.id!==EDIT_ID);d.meta.updatedAt=Date.now();setdb(d);closeM();toast('已刪除，可重新新增/發送')}
function drawRecList(){const box=document.getElementById('recList');if(!box)return;const r=periodRows().sort((a,b)=>Number(b._updated||0)-Number(a._updated||0));box.innerHTML='<div class="tblwrap"><table class="tbl"><thead><tr><th>日期</th><th>項目</th><th>狀態</th><th>Check</th><th>附件</th><th></th></tr></thead><tbody>'+r.map(x=>`<tr><td>${esc(x.date||'')}</td><td>${esc(x.title||x.auditName||'')}</td><td><span class="badge b-${esc(x.status||'open')}">${esc(x.status||'open')}</span></td><td>${esc(x.checker||'')}</td><td>${(x.photos||[]).length}</td><td><button class="btn" onclick="openRec('${x.id}')">編輯</button></td></tr>`).join('')+'</tbody></table></div>'}
function pickImport(){const inp=document.getElementById('imp');inp.onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const fr=new FileReader();fr.onload=ev=>{try{let arr=[];if(/\.json$/i.test(f.name)){const data=JSON.parse(ev.target.result);arr=Array.isArray(data)?data:(data[MODULE_KEY]||[])}else{const lines=String(ev.target.result).split(/\r?\n/).filter(Boolean),head=lines.shift().split(',').map(x=>x.replace(/^"|"$/g,''));arr=lines.map(line=>{const vals=line.match(/("[^"]*(?:""[^"]*)*"|[^,]+)/g)||[];const o={};head.forEach((h,i)=>o[h]=String(vals[i]||'').replace(/^"|"$/g,'').replace(/""/g,'"'));return o})}const d=db();d[MODULE_KEY]=d[MODULE_KEY]||[];let add=0,upd=0;arr.forEach(x=>{const r=Object.assign({id:x.id||x.ID||('CAMBODIA_LAW-'+Date.now()+'-'+Math.random().toString(16).slice(2)),date:x.date||x.Date||today(),title:x.title||x.auditName||x.Title||x.項目||'',status:x.status||x.Status||'open',checker:x.checker||x.Checker||'',owner:x.owner||'',notes:x.notes||x.Notes||'',photos:x.photos||[],_updated:Date.now()},x);const i=d[MODULE_KEY].findIndex(y=>sig(MODULE_KEY,y)===sig(MODULE_KEY,r)||y.id===r.id);if(i>=0){d[MODULE_KEY][i]=Object.assign(d[MODULE_KEY][i],r);upd++}else{d[MODULE_KEY].push(r);add++}});d.meta=d.meta||{};d.meta.updatedAt=Date.now();setdb(d);toast('匯入完成 +'+add+' / 更新 '+upd);drawRecList()}catch(err){toast('匯入失敗 '+err.message)}};fr.readAsText(f)};inp.click()}
function exportCsv(){const r=periodRows(),head=['ID','Date','Title','Status','Checker','Owner','Notes','EvidenceCount'];const body=r.map(x=>[x.id,x.date,x.title||x.auditName,x.status,x.checker,x.owner,x.notes,(x.photos||[]).length].map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(','));const blob=new Blob(['\ufeff'+head.join(',')+'\n'+body.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AC_AUDIT_'+MODULE_KEY+'_'+today()+'.csv';a.click();toast('CSV 已匯出')}function exportJson(){const blob=new Blob([JSON.stringify(periodRows(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AC_AUDIT_'+MODULE_KEY+'_'+today()+'.json';a.click();toast('JSON 已匯出')}
function buildMsg(approval){const r=periodRows(),checker=localStorage.getItem('ac_audit_checker')||'';const done=r.filter(x=>['done','closed','completed','valid','active'].includes(String(x.status||'').toLowerCase())).length,pending=r.length-done;const abnormal=r.filter(x=>/abnormal|risk|overdue|fail|異常|逾期/i.test((x.notes||'')+' '+(x.status||'')));return (approval?'✅ 核可 Approval':'📤 摘要 Summary')+'\n<b>AC Audit · 柬埔寨法律</b>\n━━━━━━━━━━━━━━━━━━━━\n📆 Period: <b>'+PERIOD+'</b>\n📝 Records: <b>'+r.length+'</b> | Done: <b>'+done+'</b> | Pending: <b>'+pending+'</b>\n👤 Check: <b>'+esc(checker||'未填')+'</b>\n👤 Approver: <b>Paul Weng / 神大</b>\n'+(abnormal.length?'⚠️ 異常 Abnormal: <b>'+abnormal.length+'</b>\n':'✅ 無重大異常 No major abnormality\n')+'━━━━━━━━━━━━━━━━━━━━\n'+r.slice(0,8).map((x,i)=>(i+1)+'. '+esc(x.date||'')+' '+esc(x.title||x.auditName||'')+' — '+esc(x.status||'')).join('\n')+'\n🕐 '+esc(nowdt())}
async function sendSummary(){const checker=prompt('請輸入 Check 人員姓名',localStorage.getItem('ac_audit_checker')||'');if(!checker)return toast('必須填寫 Check 人');localStorage.setItem('ac_audit_checker',checker.trim());try{const j=await post({action:'tg',text:buildMsg(false)});if(!j.ok&&j.status!=='ok')throw Error(j.msg||j.error||'Telegram failed');const d=db();periodRows().forEach(r=>{r._summarySentAt=Date.now();r.checker=r.checker||checker.trim()});d.meta=d.meta||{};d.meta.updatedAt=Date.now();setdb(d);toast('摘要已發，開始自動上傳');await up(true)}catch(e){toast('⚠ '+e.message)}}
async function sendApproval(){if(!confirm('送核可給 Paul Weng / 神大？'))return;try{const j=await post({action:'approval',module:'柬埔寨法律',period:PERIOD,count:periodRows().length,comment:'Approved',hash:'#'+MODULE_KEY});if(!j.ok&&j.status!=='ok')throw Error(j.msg||j.error||'Approval failed');const d=db();periodRows().forEach(r=>r._approvalSentAt=Date.now());d.meta=d.meta||{};d.meta.updatedAt=Date.now();setdb(d);toast('核可已發，開始自動上傳');await up(true)}catch(e){toast('⚠ '+e.message)}}
const h=location.hash.slice(1);show(TABS.some(x=>x.id===h)?h:DEFAULT);renderOpsStats();ping();
</script></body></html>
